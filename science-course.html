<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage · Grade 4 Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;--grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;min-height:100vh}
  .app{display:flex;min-height:100vh}
  .side{width:290px;flex-shrink:0;border-right:1.5px solid var(--blue-line);padding:22px 16px;background:rgba(251,250,245,.6)}
  .side .brand{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:2px}
  .side .sub{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  #pcount{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px}
  #pbar{height:5px;border-radius:3px;background:var(--blue-line);margin-bottom:6px;overflow:hidden}
  #pfill{height:100%;width:0;background:var(--green);transition:width .3s}
  .domain{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--blue-line)}
  .skill-btn{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:9px 10px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--ink);line-height:1.25;margin-bottom:1px}
  .skill-btn:hover{background:rgba(27,79,138,.07)}
  .skill-btn.active{background:var(--blue);color:#fff;box-shadow:2px 2px 0 rgba(27,79,138,.25)}
  .skill-btn .check{flex-shrink:0;font-size:13px;color:var(--blue-line);width:16px;text-align:center}
  .skill-btn.done .check{color:var(--green)}
  .skill-btn.active .check{color:#fff}
  .skill-btn.done .stitle{color:var(--muted)}
  .skill-btn.active .stitle,.skill-btn.active.done .stitle{color:#fff}
  .stitle{flex:1}
  .lmark{flex-shrink:0;font-size:11px;color:var(--accent)}
  .skill-btn.active .lmark{color:#fff}
  .main{flex:1;padding:26px 40px 60px;min-width:0}
  .main-inner{max-width:820px;margin:0 auto}
  .crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:28px 26px;min-height:340px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}
  .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.15;margin-bottom:14px}
  .card p{font-size:16px;line-height:1.6;margin-bottom:12px}
  .card p b{font-weight:600}
  .goalbox{background:rgba(27,79,138,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:13px 16px;margin:16px 0}
  .goalbox .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .goalbox p{margin:0;font-size:15.5px}
  .meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--blue-line);border-bottom:1px dashed var(--blue-line);padding:12px 0;margin:18px 0 20px}
  .donebadge{display:inline-block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--green);border:1.5px solid var(--green);border-radius:8px;padding:5px 10px;margin-bottom:14px}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.go{background:var(--accent);color:#fff}
  .btn.ghost{border-color:var(--blue-line);box-shadow:none;color:var(--muted)}
  .btn.sm{font-size:13px;padding:7px 13px;box-shadow:2px 2px 0 var(--ink)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .side-toggle{display:none}
  .side-back{display:none}
  @media(max-width:760px){
    .side{position:fixed;top:0;left:0;bottom:0;width:290px;z-index:9000;background:var(--paper);
      border-right:2px solid var(--ink);overflow-y:auto;transform:translateX(-105%);transition:transform .28s}
    .side.open{transform:none;box-shadow:6px 0 24px rgba(22,35,58,.25)}
    .side-toggle{display:inline-flex;align-items:center;gap:8px;position:fixed;top:12px;left:12px;z-index:8999;
      background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:30px;padding:8px 15px;
      cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
    .side-toggle:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
    .side-back{position:fixed;inset:0;z-index:8998;background:rgba(22,35,58,.28)}
    .side-back.open{display:block}
    .main{padding:60px 18px 50px}
  }
</style>
</head>
<body>
<button class="side-toggle" id="sideToggle">&#9776; Lessons</button>
<div class="side-back" id="sideBack"></div>
<div class="app">
  <nav class="side" id="sideNav">
    <div class="brand">Voyage</div>
    <div class="sub">Grade 4 · Science</div>
    <div id="pcount"></div>
    <div id="pbar"><div id="pfill"></div></div>
    <button class="btn ghost sm" id="resetBtn" style="font-size:11px;padding:4px 9px;margin-bottom:10px">Reset progress</button>
    <div id="menu"></div>
  </nav>
  <main class="main"><div class="main-inner">
    <div class="crumb" id="crumb"></div>
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn ghost" id="back">← Previous skill</button>
      <span class="crumb" id="counter" style="margin:0"></span>
      <button class="btn" id="next">Next skill →</button>
    </div>
  </div></main>
</div>

<script>
const COURSE = {
  subject:"Grade 4 · Science",
  domains:[
  { name:"Energy", skills:[
    { code:"4-PS3-1", title:"Energy and speed", file:"lesson-4ps31-energy-speed.html",
      blurb:"A marble rolled into sand leaves a crater — and the crater size tells you how much energy it carried.",
      goal:"Read energy of motion from the evidence it leaves behind, and back every claim with what you observed." },
    { code:"4-PS3-2", title:"How energy travels", file:"lesson-4ps32-energy-transfer.html",
      blurb:"Sound, light, heat, and electric current — four different couriers carrying the same package.",
      goal:"Name the carrier moving energy in any situation and trace it from source to destination." },
    { code:"4-PS3-3", title:"Energy in collisions", file:"lesson-4ps33-energy-collisions.html",
      blurb:"CLACK. One marble stops, the other flies — and the whole room hears where some of the energy went.",
      goal:"Track a crash's energy into motion, sound, and warmth, and predict what a faster collision does." },
    { code:"4-PS3-4", title:"Build an energy converter", file:"lesson-4ps34-energy-device.html",
      blurb:"Wind the rubber band, let go, and the car races off. Now use the test data to make it go farther.",
      goal:"Trace a device's conversion from stored energy to motion, then refine the design using evidence." }
  ]},
  { name:"Waves & Information", skills:[
    { code:"4-PS4-1", title:"Reading waves", file:"lesson-4ps41-waves.html",
      blurb:"Pond ripples, rope wiggles, ocean swells — every wave is one repeating pattern you can measure.",
      goal:"Measure amplitude and wavelength from a diagram, and show that waves move objects without carrying them off." },
    { code:"4-PS4-2", title:"How seeing works", file:"lesson-4ps42-light-seeing.html",
      blurb:"In a pitch-black cave you see nothing at all. Turn on the flashlight and the whole cavern appears — why?",
      goal:"Trace the light path behind every act of seeing, and explain moonlight as reflected sunlight." },
    { code:"4-PS4-3", title:"Messages in patterns", file:"lesson-4ps43-signal-patterns.html",
      blurb:"Two flashlights across a lake, one agreed code — and suddenly light is carrying sentences.",
      goal:"Send and decode messages as patterns of signals, and compare rival solutions for a foggy night." }
  ]},
  { name:"Living Things", skills:[
    { code:"4-LS1-1", title:"Built to survive", file:"lesson-4ls11-structures.html",
      blurb:"Cactus spines, hawk talons, tree roots — nothing on a living body is decoration.",
      goal:"Match structures to survival jobs and read an unfamiliar animal's whole way of life from its parts." },
    { code:"4-LS1-2", title:"Sense, think, react", file:"lesson-4ls12-senses.html",
      blurb:"A twig snaps and the rabbit is gone in half a second. Three things happened inside it, in order.",
      goal:"Trace reactions through receive, process, respond — and explain how memory changes the middle link." }
  ]},
  { name:"Earth's Story", skills:[
    { code:"4-ESS1-1", title:"Reading rock layers", file:"lesson-4ess11-rock-layers.html",
      blurb:"A canyon wall is a stack of pages, oldest at the bottom, with fossils marking what lived there.",
      goal:"Order layers by age, read fossils as evidence of past environments, and explain sea fossils on a mountaintop." },
    { code:"4-ESS2-1", title:"Breaking down, carrying away", file:"lesson-4ess21-weathering-erosion.html",
      blurb:"The only tool that dug the Grand Canyon was a river, moving grains of rock one at a time.",
      goal:"Tell weathering, erosion, and deposition apart, and design a fair test that changes one thing at a time." },
    { code:"4-ESS2-2", title:"What maps reveal", file:"lesson-4ess22-maps.html",
      blurb:"Put a century of earthquakes on one map and they don't scatter — they line up in bands.",
      goal:"Read a map's key, tell clustered patterns from scattered ones, and state predictions as odds." }
  ]},
  { name:"People & the Planet", skills:[
    { code:"4-ESS3-1", title:"Where energy comes from", file:"lesson-4ess31-resources.html",
      blurb:"Some energy sources run out and some never will — and every single one affects the environment.",
      goal:"Sort renewable from non-renewable, weigh trade-offs with evidence, and pick the source that fits a place." },
    { code:"4-ESS3-2", title:"Designing for disasters", file:"lesson-4ess32-hazards.html",
      blurb:"Two towns, one earthquake, completely different mornings. The difference was design.",
      goal:"Separate a hazard you can't prevent from an impact you can shrink, and use hazard maps to decide how to build." }
  ]}
  ]
};

let flat = [];
COURSE.domains.forEach(d => d.skills.forEach(s => flat.push({...s, domain:d.name})));
let si = 0;
const SAVE_KEY = 'voyage_g4sci_progress';
let progress = { done:{}, lastSkill:0 };
function loadProgress(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) progress=JSON.parse(raw); if(!progress.done) progress.done={}; }catch(e){} }
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); }catch(e){} }
function resetProgress(){ progress={done:{},lastSkill:0}; saveProgress(); loadSkill(0); }

function buildMenu(){
  let html='';
  COURSE.domains.forEach(d=>{
    html += `<div class="domain">${d.name}</div>`;
    d.skills.forEach(s=>{
      const idx = flat.findIndex(f=>f.code===s.code);
      html += `<button class="skill-btn" data-i="${idx}"><span class="check">○</span><span class="stitle">${s.title}</span><span class="lmark">◆</span></button>`;
    });
  });
  const m=document.getElementById('menu'); m.innerHTML=html;
  m.addEventListener('click',e=>{ const b=e.target.closest('.skill-btn'); if(b) loadSkill(+b.dataset.i); });
}
function loadSkill(i){ si=i; progress.lastSkill=i; saveProgress(); render(); scrollTo(0,0); }

function render(){
  const s=flat[si];
  const isDone = !!progress.done[s.code];
  document.getElementById('crumb').textContent = `${COURSE.subject}  ›  ${s.domain}`;
  let inner = `<div class="tag">Lesson · ${s.code}</div>`;
  inner += `<h2>${s.title}</h2>`;
  if(isDone) inner += `<div class="donebadge">✔ lesson complete — replay any time</div>`;
  inner += `<p>${s.blurb}</p>`;
  inner += `<div class="goalbox"><div class="lab">You’ll learn to</div><p>${s.goal}</p></div>`;
  inner += `<div class="meta"><span>⏱ ~15 minutes</span><span>✎ 5 questions</span><span>◆ ${s.code}</span></div>`;
  inner += `<button class="btn go" onclick="location.href='${s.file}'">${isDone?'Replay lesson ↻':'Start lesson →'}</button>`;
  document.getElementById('card').innerHTML=inner;

  const doneCount = flat.filter(f=>progress.done[f.code]).length;
  document.getElementById('pcount').textContent=`${doneCount} / ${flat.length} skills complete`;
  document.getElementById('pfill').style.width=(doneCount/flat.length*100)+'%';
  document.getElementById('counter').textContent=`skill ${si+1} / ${flat.length}`;
  document.getElementById('back').style.visibility = si===0?'hidden':'visible';
  document.getElementById('next').style.visibility = si===flat.length-1?'hidden':'visible';
  document.querySelectorAll('.skill-btn').forEach(b=>{
    const idx=+b.dataset.i, d=!!progress.done[flat[idx].code];
    b.classList.toggle('active',idx===si);
    b.classList.toggle('done',d);
    const chk=b.querySelector('.check'); if(chk) chk.textContent=d?'✔':'○';
  });
}

loadProgress();
buildMenu();
document.getElementById('back').addEventListener('click',()=>{ if(si>0) loadSkill(si-1); });
document.getElementById('next').addEventListener('click',()=>{ if(si<flat.length-1) loadSkill(si+1); });
document.getElementById('resetBtn').addEventListener('click',()=>{ if(confirm('Reset all progress?')) resetProgress(); });
loadSkill(Math.min(progress.lastSkill||0, flat.length-1));

/* mobile sidebar drawer */
(function(){
  const nav=document.getElementById('sideNav'), tog=document.getElementById('sideToggle'), bk=document.getElementById('sideBack');
  function setOpen(o){ nav.classList.toggle('open',o); bk.classList.toggle('open',o); }
  tog.addEventListener('click', ()=>setOpen(!nav.classList.contains('open')));
  bk.addEventListener('click', ()=>setOpen(false));
  nav.addEventListener('click', e=>{ if(e.target.closest('.skill-btn')) setOpen(false); });
})();
</script>
<script src="tutor-widget.js"></script>
</body>
</html>
