<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage · Rounding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;
    --grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;min-height:100vh}
  .shell{max-width:740px;margin:0 auto;padding:26px 22px 80px}
  .crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:30px 28px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:32px;line-height:1.12;margin-bottom:12px}
  h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.22;margin-bottom:14px}
  p{font-size:16.5px;line-height:1.6;margin-bottom:12px}
  b{font-weight:600}
  .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--blue-line);border-bottom:1px dashed var(--blue-line);padding:12px 0;margin:20px 0 22px}
  .goal{background:rgba(27,79,138,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 17px;margin:16px 0}
  .goal .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .goal p{margin:0;font-size:16px}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;padding:12px 22px;border-radius:10px;
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.go{background:var(--accent);color:#fff}
  .btn.sm{font-size:13.5px;padding:8px 14px;box-shadow:2px 2px 0 var(--ink)}
  .btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps .seg{height:5px;border-radius:3px;flex:1;background:var(--blue-line)}
  .steps .seg.on{background:var(--blue)}
  .hide{display:none}
  .chal{background:#fff;border:2px solid var(--blue-line);border-radius:10px;padding:13px 16px;margin:10px 0;transition:.2s}
  .chal.locked{opacity:.4}
  .chal.won{border-color:var(--green);background:rgba(46,125,91,.07)}
  .chalnum{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .chal.won .chalnum{color:var(--green)}
  .chaltxt{font-size:16px;line-height:1.45}
  .chalstate{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-top:7px}
  .chal.won .chalstate{color:var(--green);font-weight:700}
  .linebox{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:16px 12px 8px;margin:14px 0}
  .linebox svg{width:100%;height:auto;display:block}
  .ends{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .endbtn{font-family:'Space Mono',monospace;font-size:19px;font-weight:700;padding:13px 22px;border-radius:10px;
    border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .endbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .endbtn.right{border-color:var(--green);background:rgba(46,125,91,.12);color:var(--green)}
  .endbtn.wrong{border-color:var(--accent);background:rgba(240,102,63,.12);color:var(--accent)}
  .verdict{font-size:15.5px;font-weight:600;padding:11px 15px;border-radius:9px;margin-top:12px;min-height:44px;display:flex;align-items:center}
  .verdict.over{background:rgba(240,102,63,.11);color:var(--accent)}
  .verdict.exact{background:rgba(46,125,91,.13);color:var(--green)}
  .ask{background:#fff;border:1.5px dashed var(--blue-line);border-radius:12px;padding:18px;margin:18px 0}
  .ask .q{font-size:16.5px;font-weight:600;margin-bottom:12px;line-height:1.45}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .fb{margin-top:12px;font-size:15.5px;line-height:1.5;padding:11px 14px;border-radius:9px}
  .fb.ok{background:rgba(46,125,91,.12);color:var(--green)}
  .fb.no{background:rgba(240,102,63,.12);color:var(--accent)}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-family:'Space Mono',monospace;font-size:14.5px}
  th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--blue-line)}
  th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--blue-line);border-radius:10px;
    padding:12px 15px;font-family:'Space Grotesk',sans-serif;font-size:15.5px;color:var(--ink);cursor:pointer;margin-bottom:9px;line-height:1.4}
  .choice:hover{border-color:var(--blue);background:rgba(27,79,138,.05)}
  .choice.right{border-color:var(--green);background:rgba(46,125,91,.10)}
  .choice.wrong{border-color:var(--accent);background:rgba(240,102,63,.10)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .qcount{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .done-icon{font-size:44px;text-align:center;margin-bottom:8px}
  .attrib{font-size:12px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.5}
  @media(max-width:620px){.shell{padding:20px 15px 60px}.card{padding:24px 18px}h1{font-size:26px}.endbtn{font-size:16px;padding:11px 16px}}
</style>
</head>
<body>
<div class="shell">

<div id="intro">
  <div class="crumb">Grade 4 Math &nbsp;›&nbsp; Base Ten</div>
  <div class="card">
    <div class="tag">Lesson · 4.NBT.A.3</div>
    <h1>Rounding</h1>
    <p>Round 4,378 and you might get 4,000, or 4,400, or 4,380. All three are correct. Which one you get depends on a part of the question people skip straight past.</p>
    <div class="meta"><span>⏱ ~15 minutes</span><span>✎ 5 questions</span><span>◆ 4.NBT.A.3</span></div>
    <button class="btn go" onclick="startLesson()">Start lesson →</button>
  </div>
</div>

<div id="lesson" class="hide">
  <div class="crumb">Grade 4 Math &nbsp;›&nbsp; Rounding</div>
  <div class="steps" id="steps"></div>
  <div class="card" id="stage"></div>
</div>

</div>

<script>
var step=0,TOTAL=11;
var N=4378,wonCount=0,answeredRound=false;
var TASKS=[
  {place:1000,name:'thousand'},
  {place:100, name:'hundred'},
  {place:10,  name:'ten'}
];
var predictDone=false,mistakeTested=false;
var qIndex=0,qCorrect=0,answered=false;

function el(i){return document.getElementById(i);}
function startLesson(){el('intro').classList.add('hide');el('lesson').classList.remove('hide');render();scrollTo(0,0);}
function drawSteps(){var h='';for(var i=0;i<TOTAL;i++)h+='<div class="seg'+(i<=step?' on':'')+'"></div>';el('steps').innerHTML=h;}
function next(){step++;render();scrollTo(0,0);}
function back(){if(step>0){step--;render();scrollTo(0,0);}}
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}

function bounds(n,p){var lo=Math.floor(n/p)*p;return {lo:lo,hi:lo+p,mid:lo+p/2};}
function roundTo(n,p){var b=bounds(n,p);return (n-b.lo>=p/2)?b.hi:b.lo;}

/* SVG number line */
function lineSVG(n,p,showMarker){
  var b=bounds(n,p),W=620,H=126,L=52,R=52,Y=74;
  function X(v){return L+((v-b.lo)/p)*(W-L-R);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+L+'" y1="'+Y+'" x2="'+(W-R)+'" y2="'+Y+'" stroke="#16233a" stroke-width="2.5"/>';
  [[b.lo,'#16233a'],[b.hi,'#16233a']].forEach(function(t){
    s+='<line x1="'+X(t[0])+'" y1="'+(Y-13)+'" x2="'+X(t[0])+'" y2="'+(Y+13)+'" stroke="'+t[1]+'" stroke-width="2.5"/>';
    s+='<text x="'+X(t[0])+'" y="'+(Y+34)+'" text-anchor="middle" font-family="Space Mono" font-size="15" font-weight="700" fill="#16233a">'+fmt(t[0])+'</text>';
  });
  s+='<line x1="'+X(b.mid)+'" y1="'+(Y-9)+'" x2="'+X(b.mid)+'" y2="'+(Y+9)+'" stroke="#b9cbdf" stroke-width="2" stroke-dasharray="4 3"/>';
  s+='<text x="'+X(b.mid)+'" y="'+(Y+32)+'" text-anchor="middle" font-family="Space Mono" font-size="11.5" fill="#5d6b7e">'+fmt(b.mid)+'</text>';
  s+='<text x="'+X(b.mid)+'" y="'+(Y+48)+'" text-anchor="middle" font-family="Space Mono" font-size="10" fill="#5d6b7e">halfway</text>';
  if(showMarker){
    var x=X(n);
    s+='<circle cx="'+x+'" cy="'+Y+'" r="7" fill="#f0663f" stroke="#16233a" stroke-width="2"/>';
    s+='<line x1="'+x+'" y1="'+(Y-30)+'" x2="'+x+'" y2="'+(Y-9)+'" stroke="#f0663f" stroke-width="2"/>';
    s+='<text x="'+x+'" y="'+(Y-38)+'" text-anchor="middle" font-family="Space Mono" font-size="16" font-weight="700" fill="#f0663f">'+fmt(n)+'</text>';
  }
  return '<div class="linebox">'+s+'</svg></div>';
}

/* ---------- BEAT 1 ---------- */
function beat1(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],b=bounds(N,T.place),h='';
  h+='<div class="tag">Challenge</div>';
  h+='<h2>Which end is it closer to?</h2>';
  h+='<p>The number <b>4,378</b> is the orange dot. The two ends are the nearest round numbers either side of it. Click the end it is closer to.</p>';
  for(var i=0;i<TASKS.length;i++){
    var cls=i<wonCount?'chal won':(i===wonCount?'chal':'chal locked');
    var st=i<wonCount?'\u2713 '+fmt(roundTo(N,TASKS[i].place)):(i===wonCount?'now':'locked');
    h+='<div class="'+cls+'"><div class="chalnum">Challenge '+(i+1)+'</div><div class="chaltxt">Round 4,378 to the nearest <b>'+TASKS[i].name+'</b>.</div><div class="chalstate">'+st+'</div></div>';
  }
  h+=lineSVG(N,T.place,true);
  h+='<div class="ends">';
  h+='<button class="endbtn" id="eLo" onclick="pickEnd('+b.lo+')">'+fmt(b.lo)+'</button>';
  h+='<button class="endbtn" id="eHi" onclick="pickEnd('+b.hi+')">'+fmt(b.hi)+'</button>';
  h+='</div>';
  h+='<div class="verdict" id="v">Click the end 4,378 is closer to.</div>';
  h+='<div class="nav"><span></span><button class="btn" id="nx" '+(wonCount>=3?'':'disabled')+' onclick="next()">Next →</button></div>';
  el('stage').innerHTML=h;
  answeredRound=false;
}
function pickEnd(val){
  if(answeredRound)return;answeredRound=true;
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],b=bounds(N,T.place);
  var correct=roundTo(N,T.place),v=el('v');
  el(correct===b.lo?'eLo':'eHi').classList.add('right');
  if(val!==correct)el(val===b.lo?'eLo':'eHi').classList.add('wrong');
  if(val===correct){
    v.className='verdict exact';
    v.innerHTML='\u2713 4,378 to the nearest '+T.name+' is <b>'+fmt(correct)+'</b>.';
    wonCount++;
    setTimeout(function(){if(step===0)beat1();},1900);
  } else {
    v.className='verdict over';
    v.innerHTML='\u2717 Look at the dot against the dashed halfway mark. It is <b>'+fmt(correct)+'</b>. Try the next one.';
    setTimeout(function(){if(step===0){answeredRound=false;beat1();}},2600);
  }
  if(wonCount>=3&&el('nx'))el('nx').disabled=false;
}

/* ---------- BEAT 2 ---------- */
function beat2(){
  var h='';
  h+='<div class="tag">What just happened</div>';
  h+='<h2>Same number, three answers</h2>';
  h+='<p>Nothing about 4,378 changed. What changed was how far apart the two ends were.</p>';
  h+='<table><tr><th>Round to the nearest</th><th>Ends</th><th>Answer</th></tr>';
  h+='<tr><td>thousand</td><td>4,000 and 5,000</td><td>4,000</td></tr>';
  h+='<tr><td>hundred</td><td>4,300 and 4,400</td><td>4,400</td></tr>';
  h+='<tr><td>ten</td><td>4,370 and 4,380</td><td>4,380</td></tr></table>';
  h+='<div class="goal"><div class="lab">The idea</div><p>Rounding always means picking the <b>nearer of two round numbers</b>. Which two depends on the place you were asked for, so that part of the question is not optional.</p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" onclick="next()">Next →</button></div>';
  el('stage').innerHTML=h;
}

/* ---------- BEAT 3 ---------- */
function beat3(){
  var h='';
  h+='<div class="tag">Predict first</div>';
  h+='<h2>What about dead centre?</h2>';
  h+='<p>Round <b>4,500</b> to the nearest thousand. It sits exactly halfway between 4,000 and 5,000 \u2014 not nearer to either one.</p>';
  h+='<div class="ask"><div class="q">Which do you get?</div>';
  h+='<div class="row"><button class="btn sm" onclick="checkPredict(4000)">4,000</button><button class="btn sm" onclick="checkPredict(5000)">5,000</button></div>';
  h+='<div id="pfb"></div></div>';
  h+='<div id="ph" class="hide">'+lineSVG(4500,1000,true)+'<p>The dot lands on the dashed mark. There is no nearer end, so a rule was agreed: <b>exactly halfway rounds up</b>. Everyone uses the same rule so everyone gets the same answer.</p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" id="nx" '+(predictDone?'':'disabled')+' onclick="next()">Next →</button></div>';
  el('stage').innerHTML=h;
  if(predictDone)el('ph').classList.remove('hide');
}
function checkPredict(v){
  var fb=el('pfb');
  if(v===5000){fb.className='fb ok';fb.innerHTML='<b>Right \u2014 5,000.</b> Exactly halfway rounds up.';}
  else{fb.className='fb no';fb.innerHTML='<b>It is 5,000.</b> Neither end is nearer, so we use the agreed rule: halfway rounds <b>up</b>.';}
  el('ph').classList.remove('hide');predictDone=true;el('nx').disabled=false;
}

/* ---------- BEAT 4 ---------- */
function beat4(){
  var h='';
  h+='<div class="tag">Why</div>';
  h+='<h2>You can do it without drawing the line</h2>';
  h+='<p>The dashed mark is always the halfway point, so you only need to know whether the number is past it. Look at the <b>digit just to the right</b> of the place you are rounding to.</p>';
  h+='<table><tr><th>That digit</th><th>What it means</th><th>Do this</th></tr>';
  h+='<tr><td>0 to 4</td><td>not yet halfway</td><td>round down</td></tr>';
  h+='<tr><td>5 to 9</td><td>halfway or past it</td><td>round up</td></tr></table>';
  h+='<p>Rounding 4,378 to the nearest hundred: the hundreds digit is 3, and the digit to its right is <b>7</b>. Past halfway, so up to 4,400.</p>';
  h+='<div class="goal"><div class="lab">What rounding is for</div><p>It trades exactness for something easier to hold. 4,378 people at a match is roughly 4,000 \u2014 close enough to picture, and much faster to work with.</p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" onclick="next()">Next →</button></div>';
  el('stage').innerHTML=h;
}

/* ---------- BEAT 5 ---------- */
function beat5(){
  var h='';
  h+='<div class="tag">Catch the mistake</div>';
  h+='<h2>Theo rounds 4,378 to the nearest hundred and gets 4,000</h2>';
  h+='<p>His working: <i>"The 7 rounds the 8 up, then the 4 rounds the 3 down, so it goes to 4,000."</i></p>';
  h+='<div class="row" style="margin-top:12px"><button class="btn sm" onclick="testTheo()">Put it on the line</button></div>';
  h+='<div id="th" class="hide">'+lineSVG(4378,100,true)+'</div>';
  h+='<div id="tfb"></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" id="nx" '+(mistakeTested?'':'disabled')+' onclick="next()">Next →</button></div>';
  el('stage').innerHTML=h;
  if(mistakeTested)testTheo();
}
function testTheo(){
  el('th').classList.remove('hide');
  var fb=el('tfb');fb.className='fb no';
  fb.innerHTML='<b>Theo rounded twice.</b> Rounding to the nearest hundred means choosing between <b>4,300 and 4,400</b> \u2014 4,000 is not even one of the options. You look at one digit, once, and pick an end. His answer is 400 away from the truth.';
  mistakeTested=true;if(el('nx'))el('nx').disabled=false;
}

/* ---------- questions ---------- */
var QUESTIONS=[
  {q:'Round 7,642 to the nearest hundred.',a:['7,600','7,700','8,000','7,640'],correct:0,
   why:'The ends are 7,600 and 7,700. The digit after the hundreds is 4, which is not yet halfway, so round down.'},
  {q:'Round 25,850 to the nearest thousand.',a:['25,000','25,800','30,000','26,000'],correct:3,
   why:'The ends are 25,000 and 26,000. The digit after the thousands is 8, so round up.'},
  {q:'Round 3,500 to the nearest thousand.',a:['3,000','4,000','3,500','Cannot be done'],correct:1,
   why:'It sits exactly halfway, and the agreed rule is that halfway rounds up.'},
  {q:'Why can one number round to three different answers?',
   a:['Because rounding is a guess','Because the place you round to changes which two round numbers you choose between','Because bigger numbers round differently','It cannot \u2014 only one answer is right'],correct:1,
   why:'Nearest ten, hundred and thousand each give you a different pair of ends to pick from.'},
  {q:'Round 5,049 to the nearest hundred.',a:['5,100','5,050','5,000','6,000'],correct:2,
   why:'The ends are 5,000 and 5,100. The digit after the hundreds is 4, so round down to 5,000.'}
];
function beatQ(){
  var Q=QUESTIONS[qIndex],h='';
  h+='<div class="tag">Your turn</div><div class="qcount">Question '+(qIndex+1)+' of '+QUESTIONS.length+'</div>';
  h+='<h2 style="margin-top:10px">'+Q.q+'</h2>';
  for(var i=0;i<Q.a.length;i++)h+='<button class="choice" id="ch'+i+'" onclick="pick('+i+')">'+Q.a[i]+'</button>';
  h+='<div id="qfb"></div>';
  h+='<div class="nav"><span class="qcount">Score: '+qCorrect+'</span><button class="btn" id="nx" disabled onclick="nextQ()">Next →</button></div>';
  el('stage').innerHTML=h;answered=false;
}
function pick(i){
  if(answered)return;answered=true;
  var Q=QUESTIONS[qIndex];
  for(var j=0;j<Q.a.length;j++){var b=el('ch'+j);if(j===Q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong');}
  var fb=el('qfb');
  if(i===Q.correct){qCorrect++;fb.className='fb ok';fb.innerHTML='<b>Correct.</b> '+Q.why;}
  else{fb.className='fb no';fb.innerHTML='<b>No.</b> '+Q.why;}
  el('nx').disabled=false;
}
function nextQ(){qIndex++;step=(qIndex>=QUESTIONS.length)?TOTAL-1:5+qIndex;render();scrollTo(0,0);}

function markCourseDone(){
  try{
    var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');
    var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';
    var key='voyage_g4math_progress_'+kid;
    var p={done:{},lastSkill:0};
    var raw=localStorage.getItem(key); if(raw) p=JSON.parse(raw);
    if(!p.done) p.done={};
    p.done['4.NBT.3']=true;
    localStorage.setItem(key,JSON.stringify(p));
  }catch(e){}
}
function beatDone(){
  var pct=Math.round(qCorrect/QUESTIONS.length*100),h='';
  h+='<div class="done-icon">'+(pct>=80?'\u2713':'\u21bb')+'</div>';
  h+='<h2 style="text-align:center">'+(pct>=80?'Lesson complete':'Worth one more pass')+'</h2>';
  h+='<p style="text-align:center;font-family:\'Space Mono\',monospace;color:var(--muted)">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';
  if(pct>=80){markCourseDone();h+='<div class="goal" style="margin-top:18px"><div class="lab">You can now</div><p>Round any whole number to any place by finding the two ends and picking the nearer one.</p></div>';}
  else h+='<p style="margin-top:16px">Go back to Theo. He rounded twice, and 4,000 was never even one of the two options.</p>';
  h+='<div class="nav"><button class="btn sm" onclick="restart()">\u21bb Again</button><button class="btn go" onclick="location.href=\'math-course.html\'">Back to Math →</button></div>';
  h+='<div class="attrib">Task design based on IM\u00ae K\u20135 Math authored by Illustrative Mathematics\u00ae, licensed under CC BY 4.0.</div>';
  el('stage').innerHTML=h;
}
function restart(){step=0;wonCount=0;answeredRound=false;predictDone=false;mistakeTested=false;qIndex=0;qCorrect=0;render();scrollTo(0,0);}

function render(){
  drawSteps();
  if(step===0)beat1();else if(step===1)beat2();else if(step===2)beat3();
  else if(step===3)beat4();else if(step===4)beat5();
