:root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;--grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;min-height:100vh}.shell{max-width:760px;margin:0 auto;padding:26px 22px 80px}.crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:30px 28px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}h1{font-family:'Fraunces',serif;font-size:31px;line-height:1.12;margin-bottom:12px}h2{font-family:'Fraunces',serif;font-size:23px;line-height:1.22;margin-bottom:14px}p{font-size:16.5px;line-height:1.6;margin-bottom:12px}b{font-weight:600}.tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}.meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--blue-line);border-bottom:1px dashed var(--blue-line);padding:12px 0;margin:20px 0 22px}.goal{background:rgba(27,79,138,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 17px;margin:16px 0}.goal .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}.goal p{margin:0 0 8px}.btn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;padding:12px 22px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.go{background:var(--accent);color:#fff}.btn.sm{font-size:13.5px;padding:8px 14px;box-shadow:2px 2px 0 var(--ink)}.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}.steps{display:flex;gap:6px;margin-bottom:20px}.steps .seg{height:5px;border-radius:3px;flex:1;background:var(--blue-line)}.steps .seg.on{background:var(--blue)}.hide{display:none}.challenge-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0 15px}.challenge-chip{border:1.5px solid var(--blue-line);border-radius:9px;padding:8px;font-family:'Space Mono',monospace;font-size:11px;text-align:center;background:#fff}.challenge-chip.now{border-color:var(--accent);color:var(--accent);font-weight:700}.challenge-chip.done{border-color:var(--green);color:var(--green)}.diagram{background:#fff;border:1.5px solid var(--blue-line);border-radius:12px;padding:8px;margin:12px 0}.diagram svg{width:100%;max-height:260px;display:block}.svglabel{font-family:'Space Grotesk',sans-serif;font-size:15px;fill:var(--ink);font-weight:600}.svgtiny{font-family:'Space Mono',monospace;font-size:10px;fill:var(--muted)}.ask{background:#fff;border:1.5px dashed var(--blue-line);border-radius:12px;padding:18px;margin:16px 0}.ask .q{font-size:16.5px;font-weight:600;margin-bottom:12px;line-height:1.45}.choice,.stepchoice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--blue-line);border-radius:10px;padding:12px 15px;font-family:'Space Grotesk',sans-serif;font-size:15.5px;color:var(--ink);cursor:pointer;margin-bottom:9px;line-height:1.4}.choice:hover,.stepchoice:hover{border-color:var(--blue);background:rgba(27,79,138,.05)}.choice.right{border-color:var(--green);background:rgba(46,125,91,.10)}.choice.wrong{border-color:var(--accent);background:rgba(240,102,63,.10)}.inputrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.inputrow input{font-family:'Space Mono',monospace;font-size:18px;min-width:145px;max-width:260px;padding:9px 10px;border:1.5px solid var(--ink);border-radius:8px;text-align:center}.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}.checkopt{display:flex;gap:9px;align-items:center;background:#fff;border:1.5px solid var(--blue-line);border-radius:9px;padding:11px;font-size:15px}.feedback{font-size:15.5px;line-height:1.5;padding:11px 14px;border-radius:9px;min-height:44px;margin-top:12px}.feedback.ok{background:rgba(46,125,91,.12);color:var(--green)}.feedback.no{background:rgba(240,102,63,.12);color:var(--accent)}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}.qcount{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.done-icon{font-size:44px;text-align:center;margin-bottom:8px}.attrib{font-size:12px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.5}.lineplot{display:flex;align-items:flex-end;height:165px;padding:10px 12px 0;position:relative}.lineplot:after{content:'';position:absolute;left:12px;right:12px;bottom:38px;border-top:3px solid var(--ink)}.tick{flex:1;text-align:center;position:relative;z-index:1}.xstack{height:104px;display:flex;flex-direction:column-reverse;justify-content:flex-start;align-items:center}.xmark{font-family:'Space Mono',monospace;font-size:23px;line-height:18px;color:var(--blue)}.tickline{height:15px;border-left:2px solid var(--ink);margin:0 auto;width:1px}.ticklab{font-family:'Space Mono',monospace;font-size:11px;margin-top:5px;white-space:nowrap}.formula{font-family:'Space Mono',monospace;text-align:center;font-size:19px;padding:12px}.termgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:12px 0}.term{background:#fff;border:1.5px solid var(--blue-line);border-radius:10px;padding:12px}.term b{display:block;color:var(--blue);margin-bottom:3px}
.worked{width:100%;border-collapse:collapse;margin:12px 0;font-family:'Space Mono',monospace;font-size:14.5px;background:#fff;border:1.5px solid var(--blue-line);border-radius:10px;overflow:hidden}
.worked th{text-align:left;padding:9px 11px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;border-bottom:1.5px solid var(--blue-line)}
.worked td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--blue-line)}
.worked tr:last-child td{border-bottom:none}
@media(max-width:620px){.shell{padding:20px 15px 60px}.card{padding:24px 18px}h1{font-size:25px}.nav{align-items:flex-end}.lineplot{padding-left:0;padding-right:0}.ticklab{font-size:9px}}
</style></head><body><div class="shell">
<div id="intro"><div class="crumb">Grade 4 Math &nbsp;›&nbsp; Measurement & Data</div><div class="card"><div class="tag">Lesson · 4.MD.2</div><h1>Measurement word problems</h1><p>Choose the units and operation before touching the numbers.</p><div class="meta"><span>⏱ ~15 minutes</span><span>✎ 5 questions</span><span>◆ 4.MD.2</span></div><button class="btn go" onclick="startLesson()">Start lesson →</button></div></div>
<div id="lesson" class="hide"><div class="crumb">Grade 4 Math &nbsp;›&nbsp; Measurement word problems</div><div class="steps" id="steps"></div><div class="card" id="stage"></div></div></div>
<script>var CODE="4.MD.2",CHALLENGE_TITLE="Make the first move, then solve",DONE_TEXT="Solve time, money, and distance problems by matching units and choosing the operation.";var TASKS=[{"context": "A trail is 1 km 350 m long. A second trail is 875 m long. Find the total in meters.", "visual": "<div class=\"formula\">1 km 350 m + 875 m</div>", "steps": [{"type": "choice", "prompt": "What must happen first?", "options": ["Add 1 + 350 + 875", "Change 1 km to 1,000 m", "Change 875 m to kilometers", "Subtract the shorter trail"], "correct": 1, "why": "The measurements must use the same unit: 1 km 350 m = 1,350 m.", "wrong": "Meters and kilometers cannot be combined as if they were the same-sized unit."}, {"type": "choice", "prompt": "Which operation finds the combined distance?", "options": ["Division", "Subtraction", "Multiplication", "Addition"], "correct": 3, "why": "The two trail lengths are being joined.", "wrong": "The question asks for a total, so the lengths must be joined."}, {"type": "input", "prompt": "What is the total distance in meters?", "answers": ["2225m", "2225"], "placeholder": "meters", "why": "1,350 + 875 = 2,225 meters.", "wrong": "Add 1,350 m and 875 m."}]}, {"context": "You have $12.00 and spend $4.65. How much money remains?", "visual": "<div class=\"formula\">$12.00 \u2212 $4.65</div>", "steps": [{"type": "choice", "prompt": "Which operation matches \u201cremains\u201d?", "options": ["Addition", "Multiplication", "Subtraction", "Division"], "correct": 2, "why": "Money is being taken from the starting amount.", "wrong": "\u201cRemains\u201d asks what is left after spending."}, {"type": "input", "prompt": "How much remains?", "answers": ["7.35", "$7.35"], "placeholder": "dollars", "why": "$12.00 \u2212 $4.65 = $7.35.", "wrong": "Line up dollars with dollars and cents with cents, then subtract."}]}, {"context": "A runner completes 4 laps. Each lap is 650 meters. Find the total distance.", "visual": "<div class=\"formula\">4 equal laps \u00b7 650 m each</div>", "steps": [{"type": "choice", "prompt": "Which operation is most efficient?", "options": ["Multiplication", "Subtraction", "Division", "Addition only once"], "correct": 0, "why": "Four equal groups of 650 means 4 \u00d7 650.", "wrong": "\u201c4 laps, 650 meters each\u201d describes equal groups."}, {"type": "input", "prompt": "What is the total distance in meters?", "answers": ["2600m", "2600"], "placeholder": "meters", "why": "4 \u00d7 650 = 2,600 meters.", "wrong": "Multiply 650 by 4."}]}, {"context": "180 minutes of practice are shared equally across 3 days. How many minutes each day?", "visual": "<div class=\"formula\">180 minutes \u00f7 3 equal days</div>", "steps": [{"type": "choice", "prompt": "Which operation matches \u201cshared equally\u201d?", "options": ["Addition", "Division", "Subtraction", "Multiplication"], "correct": 1, "why": "An amount split into equal groups is division.", "wrong": "The same total is being split equally among three days."}, {"type": "input", "prompt": "How many minutes per day?", "answers": ["60m", "60", "60min"], "placeholder": "minutes", "why": "180 \u00f7 3 = 60 minutes.", "wrong": "Divide 180 by 3."}]}, {"context": "A movie starts at 2:45 and ends at 4:20. Find the elapsed time.", "visual": "<div class=\"formula\">2:45 \u2192 3:00 \u2192 4:00 \u2192 4:20</div>", "steps": [{"type": "choice", "prompt": "Which route counts the time without mixing hours and minutes?", "options": ["2:45 to 3:00, then 3:00 to 4:00, then 4:00 to 4:20", "Subtract 45 from 20", "Add 2:45 and 4:20", "Round both times to the nearest hour"], "correct": 0, "why": "Count forward through easy clock times: 15 min, 1 hr, then 20 min.", "wrong": "Clock minutes reset after 59, so ordinary digit subtraction is unreliable here."}, {"type": "input", "prompt": "What is the elapsed time?", "answers": ["1h35m", "1hour35minutes", "95m", "95min"], "placeholder": "1 h 35 min", "why": "15 minutes + 60 minutes + 20 minutes = 95 minutes, or 1 hour 35 minutes.", "wrong": "Count 15 minutes to 3:00, 60 to 4:00, and 20 to 4:20."}]}];var WHAT={"heading": "Units decide what the numbers mean", "body": "<p>A number without its unit is incomplete. Convert first when units differ, then choose the operation from the situation.</p><div class=\"termgrid\"><div class=\"term\"><b>Join</b>add</div><div class=\"term\"><b>Left or difference</b>subtract</div><div class=\"term\"><b>Equal groups of</b>multiply</div><div class=\"term\"><b>Shared equally</b>divide</div></div><div class=\"goal\"><div class=\"lab\">Clock time</div><p>For elapsed time, count forward through easy landmarks such as the next hour.</p></div>"};var PREDICT={"heading": "Call the operation first", "visual": "<div class=\"formula\">6 trail sections \u00b7 750 m each</div>", "prompt": "Which operation finds the total distance?", "options": ["Add 6 + 750", "Subtract", "Multiply 6 \u00d7 750", "Divide 750 \u00f7 6"], "correct": 2, "why": "Six equal groups of 750 meters means multiplication.", "reveal": "<div class=\"goal\"><div class=\"lab\">Then calculate</div><p>6 \u00d7 750 = 4,500 meters.</p></div>"};var WHY={"heading": "The story controls the arithmetic", "body": "<p>The same numbers can require different operations. \u201c4 bags with 6 apples each\u201d means multiply. \u201c24 apples shared among 4 bags\u201d means divide.</p><p>Conversions do not change the amount. They only rename it in units that can be combined.</p>"};var MISTAKE={"heading": "Nia says 3 km + 450 m = 453 m", "body": "<p>She added the visible digits before matching the units.</p>", "button": "Show the unit error", "reveal": "<div class=\"feedback no\"><b>3 km is 3,000 m.</b> The correct sum is 3,000 m + 450 m = 3,450 m.</div>"};var QUESTIONS=[{"q": "2 km 300 m + 900 m = ?", "a": ["3,200 m", "2,390 m", "1,400 m", "3,900 m"], "correct": 0, "why": "2 km 300 m is 2,300 m; 2,300 + 900 = 3,200 m."}, {"q": "You have $10.00 and spend $6.75. How much remains?", "a": ["$16.75", "$4.25", "$3.25", "$3.75"], "correct": 2, "why": "$10.00 \u2212 $6.75 = $3.25."}, {"q": "5 laps are 240 meters each. Total distance?", "a": ["48 m", "1,200 m", "245 m", "960 m"], "correct": 1, "why": "Five equal groups of 240 means 5 \u00d7 240 = 1,200 meters."}, {"q": "240 minutes shared equally across 4 days is...", "a": ["244 minutes", "960 minutes", "60 minutes", "236 minutes"], "correct": 2, "why": "240 \u00f7 4 = 60."}, {"q": "A class starts at 9:35 and ends at 10:20. How long?", "a": ["45 minutes", "55 minutes", "1 hour 15 minutes", "85 minutes"], "correct": 0, "why": "25 minutes to 10:00, then 20 more, gives 45 minutes."}];
var step=0,TOTAL=11,taskIndex=0,taskStep=0,challengeDone=false,feedback='',qIndex=0,qCorrect=0,answered=false;
function el(i){return document.getElementById(i)}
function startLesson(){el('intro').classList.add('hide');el('lesson').classList.remove('hide');render();scrollTo(0,0)}
function drawSteps(){var h='';for(var i=0;i<TOTAL;i++)h+='<div class="seg'+(i<=step?' on':'')+'"></div>';el('steps').innerHTML=h}
function next(){if(step<TOTAL-1){step++;render();scrollTo(0,0)}}
function back(){if(step>0){step--;render();scrollTo(0,0)}}
function norm(v){return String(v).toLowerCase().replace(/[,\s$°]/g,'').replace(/hours?/g,'h').replace(/minutes?/g,'m').replace(/meters?/g,'m').replace(/kilometers?/g,'km').replace(/dollars?/g,'')}
function renderChallenge(){
 var h='<div class="tag">Challenge</div><h2>'+CHALLENGE_TITLE+'</h2>';
 h+='<div class="goal"><div class="lab">Worked example \u2014 read this first</div>'+
    '<p>A rope is 2 m 40 cm long. You cut off 90 cm. How much is left?</p>'+
    '<table class="worked">'+
    '<tr><td>1. Match the units</td><td>2 m = 200 cm, so the rope is 240 cm</td><td><b>240 cm</b></td></tr>'+
    '<tr><td>2. Choose the operation</td><td>cutting off means taking away</td><td><b>subtract</b></td></tr>'+
    '<tr><td>3. Work it out</td><td>240 − 90</td><td><b>150 cm</b></td></tr>'+
    '</table>'+
    '<p>Units first, then the operation, then the arithmetic. Skipping step 1 gives 2 − 90, which is nonsense.</p></div>';
 h+='<div class="challenge-list">';for(var i=0;i<TASKS.length;i++)h+='<div class="challenge-chip '+(i<taskIndex?'done':i===taskIndex&&!challengeDone?'now':'')+'">'+(i<taskIndex?'✓ ':'')+'Round '+(i+1)+'</div>';h+='</div>';
 if(challengeDone){h+='<div class="goal"><div class="lab">Challenge complete</div><p>You made every decision yourself. Now unpack why the moves worked.</p></div>'}
 else{var T=TASKS[taskIndex],S=T.steps[taskStep];h+='<p>'+T.context+'</p>'+(T.visual||'');h+='<div class="ask"><div class="q">'+S.prompt+'</div>';
   if(S.type==='choice'){for(var j=0;j<S.options.length;j++)h+='<button class="stepchoice" onclick="chooseStep('+j+')">'+S.options[j]+'</button>'}
   else if(S.type==='input'){h+='<div class="inputrow"><input id="stepin" type="text" inputmode="decimal" placeholder="'+(S.placeholder||'?')+'"><button class="btn sm go" onclick="submitInput()">Lock it in</button></div>'}
   else if(S.type==='multi'){h+='<div class="checkgrid">';for(var k=0;k<S.options.length;k++)h+='<label class="checkopt"><input type="checkbox" name="multi" value="'+k+'"> '+S.options[k]+'</label>';h+='</div><div class="inputrow"><button class="btn sm go" onclick="submitMulti()">Check choices</button></div>'}
   h+='</div>'}
 h+='<div class="feedback '+(feedback?(feedback.indexOf('✓')===0?'ok':'no'):'')+'">'+(feedback||'Choose carefully. A wrong move stays wrong until you fix it.')+'</div>';
 h+='<div class="nav"><span></span><button class="btn" '+(challengeDone?'':'disabled')+' onclick="next()">Next →</button></div>';el('stage').innerHTML=h;
 if(!challengeDone){var inp=el('stepin');if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')submitInput()})}
}
function advanceStep(message){feedback='✓ '+message;var T=TASKS[taskIndex];setTimeout(function(){taskStep++;feedback='';if(taskStep>=T.steps.length){taskIndex++;taskStep=0;if(taskIndex>=TASKS.length)challengeDone=true}renderChallenge()},650)}
function chooseStep(i){var S=TASKS[taskIndex].steps[taskStep];if(i===S.correct)advanceStep(S.why);else{feedback='✗ '+(S.wrong||'That does not match the quantities shown. Try another decision.');renderChallenge()}}
function submitInput(){var S=TASKS[taskIndex].steps[taskStep],v=(el('stepin').value||'').trim();if(!v)return;var ans=S.answers||[S.answer],ok=ans.some(function(a){return norm(v)===norm(a)});if(ok)advanceStep(S.why);else{feedback='✗ '+(S.wrong||'Recheck the operation, units, and arithmetic.');renderChallenge()}}
function submitMulti(){var S=TASKS[taskIndex].steps[taskStep],got=Array.from(document.querySelectorAll('input[name=multi]:checked')).map(function(x){return +x.value}).sort(),want=S.correct.slice().sort();var ok=got.length===want.length&&got.every(function(v,i){return v===want[i]});if(ok)advanceStep(S.why);else{feedback='✗ '+(S.wrong||'Use the properties you can prove from the figure, then try again.');renderChallenge()}}
function renderInfo(obj,tag){var h='<div class="tag">'+tag+'</div><h2>'+obj.heading+'</h2>'+obj.body+'<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" onclick="next()">Next →</button></div>';el('stage').innerHTML=h}
var predictDone=false;
function renderPredict(){var P=PREDICT,h='<div class="tag">Predict first</div><h2>'+P.heading+'</h2>'+P.visual+'<div class="ask"><div class="q">'+P.prompt+'</div>';for(var i=0;i<P.options.length;i++)h+='<button class="stepchoice" onclick="pickPredict('+i+')">'+P.options[i]+'</button>';h+='<div id="pfb"></div></div>';if(predictDone)h+=P.reveal;h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" '+(predictDone?'':'disabled')+' onclick="next()">Next →</button></div>';el('stage').innerHTML=h}
function pickPredict(i){predictDone=true;renderPredict();var f=el('pfb');f.className='feedback '+(i===PREDICT.correct?'ok':'no');f.innerHTML=(i===PREDICT.correct?'✓ ':'✗ ')+PREDICT.why}
var mistakeDone=false;
function renderMistake(){var M=MISTAKE,h='<div class="tag">Catch the mistake</div><h2>'+M.heading+'</h2>'+M.body+'<div class="inputrow"><button class="btn sm" onclick="showMistake()">'+M.button+'</button></div>';if(mistakeDone)h+=M.reveal;h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" '+(mistakeDone?'':'disabled')+' onclick="next()">Next →</button></div>';el('stage').innerHTML=h}
function showMistake(){mistakeDone=true;renderMistake()}
function renderQuestion(){var Q=QUESTIONS[qIndex],h='<div class="tag">Your turn</div><div class="qcount">Question '+(qIndex+1)+' of '+QUESTIONS.length+'</div><h2 style="margin-top:10px">'+Q.q+'</h2>';for(var i=0;i<Q.a.length;i++)h+='<button class="choice" id="ch'+i+'" onclick="pickQ('+i+')">'+Q.a[i]+'</button>';h+='<div id="qfb"></div><div class="nav"><button class="btn sm" onclick="reviewLesson()">← Review teaching</button><span class="qcount">Score: '+qCorrect+'</span><button class="btn" id="qnext" disabled onclick="nextQ()">Next →</button></div>';el('stage').innerHTML=h;answered=false}
function pickQ(i){if(answered)return;answered=true;var Q=QUESTIONS[qIndex];for(var j=0;j<Q.a.length;j++){var b=el('ch'+j);if(j===Q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')}var f=el('qfb');f.className='feedback '+(i===Q.correct?'ok':'no');f.innerHTML=(i===Q.correct?'✓ Correct. ':'✗ Not quite. ')+Q.why;if(i===Q.correct)qCorrect++;el('qnext').disabled=false}
function nextQ(){qIndex++;step=qIndex>=QUESTIONS.length?TOTAL-1:5+qIndex;render();scrollTo(0,0)}
function reviewLesson(){step=0;render();scrollTo(0,0)}
function markCourseDone(){try{var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';var key='voyage_g4math_progress_'+kid;var p={done:{},lastSkill:0};var raw=localStorage.getItem(key);if(raw)p=JSON.parse(raw);if(!p.done)p.done={};p.done[CODE]=true;localStorage.setItem(key,JSON.stringify(p))}catch(e){}}
function renderDone(){var pct=Math.round(qCorrect/QUESTIONS.length*100),pass=pct>=80,h='<div class="done-icon">'+(pass?'✓':'↻')+'</div><h2 style="text-align:center">'+(pass?'Lesson complete':'Worth one more pass')+'</h2><p style="text-align:center" class="qcount">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';if(pass){markCourseDone();h+='<div class="goal"><div class="lab">You can now</div><p>'+DONE_TEXT+'</p></div>'}else h+='<p>Review the teaching, then try the questions again.</p>';h+='<div class="nav"><button class="btn sm" onclick="restart()">↻ Again</button><button class="btn go" onclick="goCourse()">Back to Math →</button></div><div class="attrib">Task design based on IM® K–5 Math authored by Illustrative Mathematics®, licensed under CC BY 4.0.</div>';el('stage').innerHTML=h}
function goCourse(){location.href='math-course.html'}
function restart(){step=0;taskIndex=0;taskStep=0;challengeDone=false;feedback='';predictDone=false;mistakeDone=false;qIndex=0;qCorrect=0;answered=false;render();scrollTo(0,0)}
function render(){drawSteps();if(step===0)renderChallenge();else if(step===1)renderInfo(WHAT,'What just happened');else if(step===2)renderPredict();else if(step===3)renderInfo(WHY,'Why');else if(step===4)renderMistake();else if(step>=5&&step<TOTAL-1)renderQuestion();else renderDone()}
</script></body></html>
