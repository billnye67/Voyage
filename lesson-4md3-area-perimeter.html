[{"type": "choice", "prompt": "Does \u201cfencing surrounds it\u201d ask for area or perimeter?", "options": ["Area", "Perimeter", "Both", "Neither"], "correct": 1, "why": "Fencing follows the outside edge.", "wrong": "Anything surrounding the shape measures the boundary."}, {"type": "input", "prompt": "How many meters of fencing?", "answers": ["34", "34m"], "placeholder": "meters", "why": "2 \u00d7 12 + 2 \u00d7 5 = 34 meters.", "wrong": "Add 12 + 5 + 12 + 5."}]}];var WHAT={"heading": "Inside and around are different measurements", "body": "<div class=\"termgrid\"><div class=\"term\"><b>Area</b>inside space<br>length \u00d7 width<br>square units</div><div class=\"term\"><b>Perimeter</b>distance around<br>2 \u00d7 length + 2 \u00d7 width<br>units</div></div><p>The formulas come from the picture: area counts a grid of rows and columns; perimeter adds every side.</p>"};var PREDICT={"heading": "Read the purpose, not just the numbers", "visual": "<div class=\"diagram\"><svg viewBox=\"0 0 420 210\" role=\"img\" aria-label=\"Rectangle, 10 by 4\">\n      <rect x=\"80\" y=\"35\" width=\"250\" height=\"125\" rx=\"4\" fill=\"rgba(27,79,138,.08)\" stroke=\"var(--blue)\" stroke-width=\"3\"/>\n      <text x=\"205\" y=\"190\" text-anchor=\"middle\" class=\"svglabel\">10 units</text>\n      <text x=\"48\" y=\"102\" text-anchor=\"middle\" class=\"svglabel\" transform=\"rotate(-90 48 102)\">4 units</text>\n    </svg></div>", "prompt": "A rug must cover this floor. What should be calculated?", "options": ["10 + 4", "Area: 10 \u00d7 4", "Perimeter: 2 \u00d7 10 + 2 \u00d7 4", "10 \u2212 4"], "correct": 1, "why": "Covering a surface asks for the inside area.", "reveal": "<div class=\"goal\"><div class=\"lab\">Result</div><p>10 \u00d7 4 = 40 square units.</p></div>"};var WHY={"heading": "The unit exposes the measurement", "body": "<p>Perimeter is one-dimensional, so its answer uses units such as meters. Area covers a two-dimensional surface, so its answer uses square meters.</p><p>A correct number with the wrong unit can describe the wrong measurement.</p>"};var MISTAKE={"heading": "Leo says a 5-by-3 rectangle has area 16", "body": "<p>He calculated 5 + 3 + 5 + 3.</p>", "button": "Name what Leo found", "reveal": "<div class=\"feedback no\"><b>Leo found the perimeter.</b> The area is 5 \u00d7 3 = 15 square units.</div>"};var QUESTIONS=[{"q": "Area of an 8-by-6 rectangle?", "a": ["28 square units", "48 square units", "48 units", "14 square units"], "correct": 1, "why": "Area = 8 \u00d7 6 = 48 square units."}, {"q": "Perimeter of an 8-by-6 rectangle?", "a": ["48 units", "14 units", "28 units", "24 units"], "correct": 2, "why": "8 + 6 + 8 + 6 = 28 units."}, {"q": "Which situation asks for area?", "a": ["Fencing a yard", "Framing a picture", "Tiling a floor", "Walking around a field"], "correct": 2, "why": "Tiles cover the inside surface."}, {"q": "A square has side 5. Its perimeter is...", "a": ["20 units", "10 units", "25 square units", "15 units"], "correct": 0, "why": "Four sides of 5 total 20 units."}, {"q": "Which unit fits the area of a classroom floor?", "a": ["meters", "minutes", "degrees", "square meters"], "correct": 3, "why": "Area uses square units."}];
var step=0,TOTAL=11,taskIndex=0,taskStep=0,challengeDone=false,feedback='',qIndex=0,qCorrect=0,answered=false;

function reviewLesson(){step=0;render();scrollTo(0,0)}
function markCourseDone(){try{var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';var key='voyage_g4math_progress_'+kid;var p={done:{},lastSkill:0};var raw=localStorage.getItem(key);if(raw)p=JSON.parse(raw);if(!p.done)p.done={};p.done[CODE]=true;localStorage.setItem(key,JSON.stringify(p))}catch(e){}}
function renderDone(){var pct=Math.round(qCorrect/QUESTIONS.length*100),pass=pct>=80,h='<div class="done-icon">'+(pass?'✓':'↻')+'</div><h2 style="text-align:center">'+(pass?'Lesson complete':'Worth one more pass')+'</h2><p style="text-align:center" class="qcount">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';if(pass){markCourseDone();h+='<div class="goal"><div class="lab">You can now</div><p>'+DONE_TEXT+'</p></div>'}else h+='<p>Review the teaching, then try the questions again.</p>';h+='<div class="nav"><button class="btn sm" onclick="restart()">↻ Again</button><button class="btn go" onclick="goCourse()">Back to Math →</button></div><div class="attrib">Task design based on IM® K–5 Math authored by Illustrative Mathematics®, licensed under CC BY 4.0.</div>';el('stage').innerHTML=h}
function goCourse(){location.href='math-course.html'}
function restart(){step=0;taskIndex=0;taskStep=0;challengeDone=false;feedback='';predictDone=false;mistakeDone=false;qIndex=0;qCorrect=0;answered=false;render();scrollTo(0,0)}
function render(){drawSteps();if(step===0)renderChallenge();else if(step===1)renderInfo(WHAT,'What just happened');else if(step===2)renderPredict();else if(step===3)renderInfo(WHY,'Why');else if(step===4)renderMistake();else if(step>=5&&step<TOTAL-1)renderQuestion();else renderDone()}
</script></body></html>
