<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage · Grade 4 Social Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;--grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;min-height:100vh}
  .app{display:flex;max-width:1080px;margin:0 auto;min-height:100vh}
  .side{width:290px;flex-shrink:0;border-right:1.5px solid var(--blue-line);padding:22px 16px;background:rgba(251,250,245,.6)}
  .side .brand{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:2px}
  .side .brand a{color:inherit;text-decoration:none}
  .side .sub{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  #pcount{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px}
  #pbar{height:5px;border-radius:3px;background:var(--blue-line);margin-bottom:6px;overflow:hidden}
  #pfill{height:100%;width:0;background:var(--green);transition:width .3s}
  .domain{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--blue-line)}
  .skill-btn{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:9px 10px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--ink);line-height:1.25;margin-bottom:1px}
  .skill-btn:hover{background:rgba(27,79,138,.07)}
  .skill-btn.active{background:var(--blue);color:#fff;box-shadow:2px 2px 0 rgba(27,79,138,.25)}
  .skill-btn .check{flex-shrink:0;font-size:13px;color:var(--blue-line);width:16px;text-align:center}
  .skill-btn.done .check{color:var(--green)}
  .skill-btn.active .check{color:#fff}
  .skill-btn.done .stitle{color:var(--muted)}
  .skill-btn.active .stitle,.skill-btn.active.done .stitle{color:#fff}
  .stitle{flex:1}
  .lessonmark{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent);flex-shrink:0}
  .skill-btn.active .lessonmark{color:#fff}
  .main{flex:1;padding:26px 30px 60px;min-width:0}
  .crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:28px 26px;min-height:340px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}
  .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.15;margin-bottom:14px}
  .card p{font-size:16px;line-height:1.62;margin-bottom:12px}
  .card p b{font-weight:600}
  .meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin:16px 0 20px}
  .goalbox{background:rgba(240,102,63,.08);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 15px;font-size:15px;margin:4px 0 18px}
  .goalbox .lab{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
  .donebadge{display:inline-flex;align-items:center;gap:7px;background:rgba(46,125,91,.12);border:1.5px solid var(--green);color:var(--green);
    font-weight:600;font-size:14px;border-radius:20px;padding:6px 14px;margin-bottom:14px}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;padding:11px 20px;border-radius:11px;
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-block}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.go{background:var(--accent);color:#fff}
  .btn.ghost{border-color:var(--blue-line);box-shadow:none;color:var(--muted)}
  .btn.sm{font-size:13px;padding:7px 13px;box-shadow:2px 2px 0 var(--ink)}
  @media(max-width:760px){.app{flex-direction:column}.side{width:100%;border-right:none;border-bottom:1.5px solid var(--blue-line)}.main{padding:22px 18px 50px}}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><a href="home.html">Voyage</a></div>
    <div class="sub">Grade 4 · Social Studies</div>
    <div id="pcount"></div>
    <div id="pbar"><div id="pfill"></div></div>
    <button class="btn ghost sm" id="resetBtn" style="font-size:11px;padding:4px 9px;margin-bottom:10px">Reset progress</button>
    <div id="menu"></div>
  </nav>
  <main class="main">
    <div class="crumb" id="crumb"></div>
    <div class="card" id="card"></div>
  </main>
</div>

<script>
const SAVE_KEY='voyage_g4ss_progress';
const DOMAINS=[
  {name:'Geography', skills:[
    {code:'SS.4.G.1', title:'Map skills', file:'lesson-ss1-map-skills.html', mins:15,
     blurb:'A supply cache is buried on Gull Island, and the ranger’s note is useless — until you can read a map. Earn the four tools: compass, legend, grid, and scale.',
     goal:'Read any map like a ranger: direction, symbols, addresses, and distance.'},
    {code:'SS.4.G.2', title:'The 5 U.S. regions', file:'lesson-ss2-us-regions.html', mins:15,
     blurb:'Fifty states is a lot to hold in your head — so Americans fold them into five big neighborhoods. Match mystery postcards to the map and meet all five.',
     goal:'Name the five regions and predict a place’s land, weather, and daily life from its region.'},
    {code:'SS.4.G.3', title:'States, capitals & landforms', file:'lesson-ss3-states-capitals-landforms.html', mins:15,
     blurb:'Quick: what’s the capital of New York? If you said New York City, this lesson is for you. Then read the land itself — Rockies, Appalachians, Great Plains, Mississippi.',
     goal:'Run the one true capital test, and sketch the country’s landform skeleton from memory.'},
    {code:'SS.4.G.4', title:'How geography shapes life', file:'lesson-ss4-geography-shapes-life.html', mins:15,
     blurb:'Play city founder in 1800: pick the spot, watch the land decide your town’s fate — then learn the two moves people use to push back.',
     goal:'Explain where cities grow, what jobs the land hands out, and adapt vs modify.'}
  ]},
  {name:'Civics', skills:[
    {code:'SS.4.C.1', title:'Why we have rules & laws', file:'lesson-ss5-rules-laws.html', mins:15,
     blurb:'Play a game against Remy, who keeps inventing rules that help Remy. Feel exactly why rules exist — then learn what levels a rule up into a law.',
     goal:'Spot a rule’s job (fair, safe, predictable) and run the four-part rule-vs-law test.'},
    {code:'SS.4.C.2', title:'How democracy works', file:'lesson-ss6-democracy.html', mins:15,
     blurb:'Your class gets ONE reward — but who decides? Try the loudest kid, then a favorite, then a vote. Then scale it up to a country of millions.',
     goal:'Run a fair vote, do the majority math, and explain representatives and fair losses.'},
    {code:'SS.4.C.3', title:'The three branches', file:'lesson-ss7-three-branches.html', mins:15,
     blurb:'Marcus makes the rules, enforces the rules, AND judges every appeal. Live one afternoon under Marcus — then meet America’s fix: three branches watching each other.',
     goal:'Name what each branch does and how checks and balances stop a power grab.'},
    {code:'SS.4.C.4', title:'Rights & responsibilities', file:'lesson-ss8-rights-responsibilities.html', mins:15,
     blurb:'A day with all your rights and nobody’s responsibilities — and watch every right collapse. Then learn both sides of the citizen’s deal.',
     goal:'Name your rights, the duties holding each one up, and the citizen jobs beyond them.'}
  ]},
  {name:'Economics', skills:[
    {code:'SS.4.E.1', title:'Needs vs wants', file:'lesson-ss9-needs-wants.html', mins:15,
     blurb:'A storm is coming and you hold the family’s $50. The cart can’t fit everything — choose wrong and the weekend gets dark and thirsty.',
     goal:'Use the go-without test, put needs first, and see every choice’s hidden trade.'},
    {code:'SS.4.E.2', title:'Goods, services, producers & consumers', file:'lesson-ss10-goods-services.html', mins:15,
     blurb:'Six shops on Main Street — sometimes you leave holding a thing, sometimes with empty hands and a lighter pocket. Crack the difference and meet the circle of makers and buyers.',
     goal:'Sort goods from services and switch between producer and consumer like everyone does daily.'},
    {code:'SS.4.E.3', title:'Money, trade & choices', file:'lesson-ss11-money-trade.html', mins:15,
     blurb:'Trade Day: no money allowed. Three exhausting trades later, you’ll understand exactly why humans invented money — and what prices are quietly telling you.',
     goal:'Explain barter’s flaw, money’s three jobs, and read prices as scarcity messages.'}
  ]},
  {name:'History', skills:[
    {code:'SS.4.H.1', title:'How we know about the past', file:'lesson-ss12-knowing-the-past.html', mins:15,
     blurb:'Family legend says Grandma walked three miles to school. Her own 1962 diary says otherwise. Become a history detective: primary sources, secondary sources, and the three grilling questions.',
     goal:'Sort primary from secondary sources and cross-check them like a historian.'},
    {code:'SS.4.H.2', title:'How communities change over time', file:'lesson-ss13-communities-change.html', mins:15,
     blurb:'Three shuffled photos of the same street corner across a century. Put the story back in order and find the engines — inventions, arrivals, jobs — that rebuild every town.',
     goal:'Order the past from clues, name the engines of change, and build a timeline.'},
    {code:'SS.4.H.3', title:'U.S. symbols & landmarks', file:'lesson-ss14-symbols-landmarks.html', mins:15,
     blurb:'The flag is a message written in numbers — 50 of something, 13 of something else. Crack the code, then meet the eagle, the statue, the cracked bell, and the mountain with faces.',
     goal:'Decode the flag and tell the true story behind America’s famous symbols and landmarks.'}
  ]}
];

let progress={done:{},lastSkill:0};
function loadProgress(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(raw)progress=Object.assign({done:{},lastSkill:0},JSON.parse(raw)); }catch(e){} if(!progress.done)progress.done={}; }
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); }catch(e){} }

const flat=[];
DOMAINS.forEach(d=>d.skills.forEach(s=>{s.domain=d.name;flat.push(s);}));
let cur=0;

function drawMenu(){
  let h='';let idx=0;
  DOMAINS.forEach(d=>{
    h+='<div class="domain">'+d.name+'</div>';
    d.skills.forEach(s=>{
      const done=!!progress.done[s.code];
      h+='<button class="skill-btn'+(idx===cur?' active':'')+(done?' done':'')+'" data-i="'+idx+'">'
        +'<span class="check">'+(done?'✓':'○')+'</span><span class="stitle">'+s.title+'</span><span class="lessonmark">◆</span></button>';
      idx++;
    });
  });
  document.getElementById('menu').innerHTML=h;
  document.querySelectorAll('.skill-btn').forEach(b=>b.addEventListener('click',()=>{cur=+b.dataset.i;progress.lastSkill=cur;saveProgress();draw();}));
  const doneCount=flat.filter(s=>progress.done[s.code]).length;
  document.getElementById('pcount').textContent=doneCount+' / '+flat.length+' skills mastered';
  document.getElementById('pfill').style.width=Math.round(doneCount/flat.length*100)+'%';
}

function drawCard(){
  const s=flat[cur];
  const done=!!progress.done[s.code];
  document.getElementById('crumb').textContent='Grade 4 Social Studies  ›  '+s.domain;
  let h='<div class="tag">Lesson · '+s.code+'</div>';
  h+='<h2>'+s.title+'</h2>';
  if(done)h+='<div class="donebadge">✓ Mastered — replay any time</div>';
  h+='<p>'+s.blurb+'</p>';
  h+='<div class="goalbox"><div class="lab">You’ll be able to</div>'+s.goal+'</div>';
  h+='<div class="meta"><span>⏱ ~'+s.mins+' minutes</span><span>✎ 5 questions</span><span>◆ '+s.code+'</span></div>';
  h+='<a class="btn go" href="'+s.file+'">'+(done?'Replay lesson →':'Start lesson →')+'</a>';
  document.getElementById('card').innerHTML=h;
}

function draw(){drawMenu();drawCard();}

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Reset all Social Studies progress?')){progress={done:{},lastSkill:0};saveProgress();cur=0;draw();}
});

loadProgress();
cur=Math.min(progress.lastSkill||0,flat.length-1);
draw();
</script>
<script src="tutor-widget.js"></script>
</body>
</html>
