<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage · Division with remainders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;
    --grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b;--ten:#1b4f8a;--one:#7aa8cc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;min-height:100vh}
  .shell{max-width:740px;margin:0 auto;padding:26px 22px 80px}
  .crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:30px 28px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:31px;line-height:1.12;margin-bottom:12px}
  h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.22;margin-bottom:14px}
  p{font-size:16.5px;line-height:1.6;margin-bottom:12px}
  b{font-weight:600}
  .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--blue-line);border-bottom:1px dashed var(--blue-line);padding:12px 0;margin:20px 0 22px}
  .goal{background:rgba(27,79,138,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 17px;margin:16px 0}
  .goal .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .goal p{margin:0 0 8px;font-size:16px}
  .goal p:last-child{margin-bottom:0}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;padding:12px 22px;border-radius:10px;
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.go{background:var(--accent);color:#fff}
  .btn.sm{font-size:13.5px;padding:8px 14px;box-shadow:2px 2px 0 var(--ink)}
  .btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps .seg{height:5px;border-radius:3px;flex:1;background:var(--blue-line)}
  .steps .seg.on{background:var(--blue)}
  .hide{display:none}
  .chal{background:#fff;border:2px solid var(--blue-line);border-radius:10px;padding:13px 16px;margin:10px 0;transition:.2s}
  .chal.locked{opacity:.4}
  .chal.won{border-color:var(--green);background:rgba(46,125,91,.07)}
  .chalnum{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .chal.won .chalnum{color:var(--green)}
  .chaltxt{font-size:16px;line-height:1.45}
  .chalstate{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-top:7px}
  .chal.won .chalstate{color:var(--green);font-weight:700}
  /* blocks */
  .pool{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:14px;margin:14px 0}
  .poolhead{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:46px}
  .slab{width:42px;height:42px;background:#123f6d;border:1.5px solid var(--ink);border-radius:3px}
  .rod{width:14px;height:42px;background:var(--ten);border:1.5px solid var(--ink);border-radius:3px}
  .cube{width:14px;height:14px;background:var(--one);border:1.5px solid var(--ink);border-radius:2px}
  .groups{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
  .grp{border:2px dashed var(--blue-line);border-radius:9px;padding:9px;min-width:74px;text-align:center;background:#fff}
  .grp .blocks{justify-content:center;min-height:46px}
  .grplab{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:7px}
  .grp.full{border-style:solid;border-color:var(--green)}
  .leftover{border-color:var(--accent);border-style:solid}
  .pours{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
  .pour{font-family:'Space Mono',monospace;font-size:13.5px;font-weight:700;padding:10px 14px;border-radius:9px;
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .pour:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .pour[disabled]{cursor:not-allowed;box-shadow:none}
  .stepline{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);text-align:center;margin-top:10px}
  .work{font-family:'Space Mono',monospace;font-size:15.5px;text-align:center;margin:10px 0 4px;line-height:1.7}
  .verdict{font-size:15.5px;font-weight:600;padding:11px 15px;border-radius:9px;margin-top:12px;min-height:44px;display:flex;align-items:center}
  .verdict.over{background:rgba(240,102,63,.11);color:var(--accent)}
  .verdict.exact{background:rgba(46,125,91,.13);color:var(--green)}
  .ask{background:#fff;border:1.5px dashed var(--blue-line);border-radius:12px;padding:18px;margin:16px 0}
  .ask .q{font-size:16.5px;font-weight:600;margin-bottom:12px;line-height:1.45}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  input[type=text]{font-family:'Space Mono',monospace;font-size:19px;width:96px;padding:9px 10px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;text-align:center}
  .fb{margin-top:12px;font-size:15.5px;line-height:1.5;padding:11px 14px;border-radius:9px}
  .fb.ok{background:rgba(46,125,91,.12);color:var(--green)}
  .fb.no{background:rgba(240,102,63,.12);color:var(--accent)}
  table.t{width:100%;border-collapse:collapse;margin:14px 0;font-family:'Space Mono',monospace;font-size:14.5px}
  table.t th,table.t td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--blue-line)}
  table.t th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--blue-line);border-radius:10px;
    padding:12px 15px;font-family:'Space Grotesk',sans-serif;font-size:15.5px;color:var(--ink);cursor:pointer;margin-bottom:9px;line-height:1.4}
  .choice:hover{border-color:var(--blue);background:rgba(27,79,138,.05)}
  .choice.right{border-color:var(--green);background:rgba(46,125,91,.10)}
  .choice.wrong{border-color:var(--accent);background:rgba(240,102,63,.10)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .qcount{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .done-icon{font-size:44px;text-align:center;margin-bottom:8px}
  .attrib{font-size:12px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.5}
  @media(max-width:620px){.shell{padding:20px 15px 60px}.card{padding:24px 18px}h1{font-size:25px}
    .rod{width:11px;height:34px}.cube{width:11px;height:11px}.grp{min-width:60px}}
</style>
</head>
<body>
<div class="shell">

<div id="intro">
  <div class="crumb">Grade 4 Math &nbsp;›&nbsp; Base Ten</div>
  <div class="card">
    <div class="tag">Lesson · 4.NBT.B.6</div>
    <h1>Division with remainders</h1>
    <p>Sharing 96 between 4 sounds awful. Sharing 9 ten-blocks and 6 singles between 4 is something you could do with your hands.</p>
    <div class="meta"><span>⏱ ~15 minutes</span><span>✎ 5 questions</span><span>◆ 4.NBT.B.6</span></div>
    <button class="btn go" onclick="startLesson()">Start lesson →</button>
  </div>
</div>

<div id="lesson" class="hide">
  <div class="crumb">Grade 4 Math &nbsp;›&nbsp; Division with remainders</div>
  <div class="steps" id="steps"></div>
  <div class="card" id="stage"></div>
</div>

</div>

<script>
var step=0,TOTAL=11;
var TASKS=[
  {n:84, d:4},
  {n:96, d:4},
  {n:137,d:6}
];
var wonCount=0,phase=0;   /* 0 = share tens, 1 = share ones, 2 = final answer */
var predictDone=false,mistakeTested=false;
var qIndex=0,qCorrect=0,answered=false;

function el(i){return document.getElementById(i);}
function startLesson(){el('intro').classList.add('hide');el('lesson').classList.remove('hide');render();scrollTo(0,0);}
function drawSteps(){var h='';for(var i=0;i<TOTAL;i++)h+='<div class="seg'+(i<=step?' on':'')+'"></div>';el('steps').innerHTML=h;}
function next(){step++;render();scrollTo(0,0);}
function back(){if(step>0){step--;render();scrollTo(0,0);}}

/* the whole division, worked out once so every screen agrees */
function plan(T){
  var hund=Math.floor(T.n/100);
  var tens=Math.floor(T.n/10), ones=T.n%10;
  var tensEach=Math.floor(tens/T.d), tensLeft=tens%T.d;
  var onesNow=tensLeft*10+ones;
  var onesEach=Math.floor(onesNow/T.d), rem=onesNow%T.d;
  return {hund:hund,tens:tens,ones:ones,tensEach:tensEach,tensLeft:tensLeft,
          onesNow:onesNow,onesEach:onesEach,rem:rem,
          answer:tensEach*10+onesEach};
}
function slabHTML(n){
  var h='';for(var i=0;i<n;i++)h+='<div class="slab"></div>';
  return h?'<div class="blocks">'+h+'</div>':'';
}
function blocksHTML(rods,cubes){
  var h='<div class="blocks">';
  for(var i=0;i<rods;i++)h+='<div class="rod"></div>';
  for(var j=0;j<cubes;j++)h+='<div class="cube"></div>';
  return h+'</div>';
}

/* ---------- BEAT 1 ---------- */
/* dealt[i] = {tens:n, ones:n} for each group; poolTens/poolOnes = what is left in the pile */
var dealt=[],poolHund=0,poolTens=0,poolOnes=0,inited=false,broken=false;

function initTask(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],P=plan(T);
  dealt=[];for(var i=0;i<T.d;i++)dealt.push({tens:0,ones:0});
  poolHund=P.hund;
  poolTens=P.tens-P.hund*10;     /* hundreds start as hundreds, not tens */
  poolOnes=P.ones;broken=false;inited=true;
}
function breakHundred(){
  if(poolHund<=0)return;
  poolHund--;poolTens+=10;beat1();
}
function dealTen(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)];
  if(poolTens<T.d)return;                 /* only deal a full round */
  for(var i=0;i<T.d;i++){dealt[i].tens++;poolTens--;}
  beat1();
}
function dealOne(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)];
  if(poolOnes<T.d)return;
  for(var i=0;i<T.d;i++){dealt[i].ones++;poolOnes--;}
  beat1();
}
function breakTen(){
  if(poolTens<=0)return;
  poolTens--;poolOnes+=10;broken=true;
  beat1();
}
function resetTask(){initTask();beat1();}

function beat1(){
  if(!inited)initTask();
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],P=plan(T),h='';

  h+='<div class="tag">Challenge '+(wonCount+1)+' of 3</div>';
  h+='<h2>Share '+T.n+' between '+T.d+'</h2>';

  h+='<div class="pool'+((poolTens<T.d&&poolTens>0)?' leftover':'')+'">';
  h+='<div class="poolhead">the pile</div>';
  h+=slabHTML(poolHund)+blocksHTML(poolTens,poolOnes);
  h+='</div>';

  h+='<div class="groups">';
  for(var k=0;k<T.d;k++){
    var g=dealt[k];
    h+='<div class="grp'+((g.tens||g.ones)?' full':'')+'">'+blocksHTML(g.tens,g.ones)+
       '<div class="grplab">'+(g.tens*10+g.ones)+'</div></div>';
  }
  h+='</div>';

  var canTen=poolTens>=T.d, canOne=poolOnes>=T.d, canBreak=poolTens>0&&poolTens<T.d&&poolHund===0;
  h+='<div class="pours">';
  if(P.hund)h+='<button class="pour" onclick="breakHundred()"'+(poolHund>0?'':' disabled style="opacity:.35"')+'>break a big block</button>';
  h+='<button class="pour" onclick="dealTen()"'+(canTen?'':' disabled style="opacity:.35"')+'>deal a tall to each</button>';
  h+='<button class="pour" onclick="breakTen()"'+(canBreak?'':' disabled style="opacity:.35"')+'>break a tall block</button>';
  h+='<button class="pour" onclick="dealOne()"'+(canOne?'':' disabled style="opacity:.35"')+'>deal a small to each</button>';
  h+='<button class="pour" onclick="resetTask()">start over</button>';
  h+='</div>';

  var msg;
  if(poolHund>0) msg='A big block is 100. Too big to share between '+T.d+' \u2014 break it.';
  else if(canTen) msg='Enough tall blocks to give every group one more.';
  else if(canBreak) msg='Only '+poolTens+' tall left, and '+T.d+' groups. Break it into 10 small.';
  else if(canOne) msg='Enough small blocks to give every group one more.';
  else if(poolOnes>0) msg=poolOnes+' left, and '+T.d+' groups. They will not go round.';
  else msg='Pile empty.';
  h+='<div class="work">'+msg+'</div>';

  var finished=(poolHund===0)&&(poolTens===0)&&(poolOnes<T.d);
  if(finished){
    h+='<div class="ask"><div class="q">What does each group hold'+(poolOnes?', and how many are left?':'?')+'</div>';
    h+='<div class="row"><input type="text" id="dg" placeholder="'+(poolOnes?'12 r 3':'?')+'"><button class="btn sm" style="background:var(--accent);color:#fff" onclick="lockIn()">Lock it in</button></div></div>';
  }
  h+='<div class="verdict" id="v">'+(finished?'Count one group.':'')+'</div>';
  h+='<div class="nav"><span></span><button class="btn" id="nx" '+(wonCount>=3?'':'disabled')+' onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
}

function lockIn(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],P=plan(T);
  var raw=(el('dg').value||'').replace(/\s/g,'');
  if(raw==='')return;
  var v=el('v');
  var m=raw.toLowerCase().replace('remainder','r').match(/^(\d+)(?:r(\d+))?$/);
  var got=m?parseInt(m[1],10):NaN;
  var gotRem=m&&m[2]!==undefined?parseInt(m[2],10):0;
  if(got===P.answer&&gotRem===P.rem){
    v.className='verdict exact';
    v.innerHTML='\u2713 '+T.n+' \u00f7 '+T.d+' = <b>'+P.answer+(P.rem?' remainder '+P.rem:'')+'</b>';
    wonCount++;inited=false;
    if(wonCount>=3&&el('nx'))el('nx').disabled=false;
    setTimeout(function(){if(step===0)beat1();},2000);
  } else {
    v.className='verdict over';
    if(!m)v.innerHTML='\u2717 Write it as a number, or like <b>12 r 3</b> if blocks are left over.';
    else if(got!==P.answer)v.innerHTML='\u2717 Not '+got+'. Count one group: '+dealt[0].tens+' tall blocks is '+(dealt[0].tens*10)+', plus '+dealt[0].ones+' small.';
    else v.innerHTML='\u2717 The amount in each group is right, but there '+(P.rem===1?'is 1 block':'are '+P.rem+' blocks')+' still left over. Write it as <b>'+P.answer+' r '+P.rem+'</b>.';
  }
}

/* ---------- BEAT 2 ---------- */
function beat2(){
  var h='';
  h+='<div class="tag">What just happened</div>';
  h+='<h2>The stranded ten had to be broken</h2>';
  h+='<table class="t"><tr><th>96 \u00f7 4</th><th></th></tr>';
  h+='<tr><td>9 tens shared by 4</td><td>2 each, 1 stranded</td></tr>';
  h+='<tr><td>break that ten</td><td>10 ones + the 6 there = 16</td></tr>';
  h+='<tr><td>16 ones shared by 4</td><td>4 each, none left</td></tr>';
  h+='<tr><td>each group holds</td><td>2 tens + 4 ones = <b>24</b></td></tr></table>';
  h+='<div class="goal"><div class="lab">The idea</div><p>Big blocks first. Whatever will not go round gets <b>broken smaller</b> and joins the next pile.</p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
}

/* ---------- BEAT 3 ---------- */
function beat3(){
  var h='';
  h+='<div class="tag">Predict first</div>';
  h+='<h2>137 between 6</h2>';
  h+='<p>13 tall blocks, 7 small.</p>';
  h+='<div class="ask"><div class="q">Share the 13 tall between 6 groups. How many tall are stranded?</div>';
  h+='<div class="row"><button class="btn sm" onclick="checkPredict(0)">0</button><button class="btn sm" onclick="checkPredict(1)">1</button><button class="btn sm" onclick="checkPredict(2)">2</button><button class="btn sm" onclick="checkPredict(7)">7</button></div>';
  h+='<div id="pfb"></div></div>';
  h+='<div id="ph" class="hide"><div class="work">6 \u00d7 2 = 12 used, <b>1 left</b> \u2192 breaks into 10<br>10 + 7 = 17 small, 6 \u00d7 2 = 12 used, <b>5 left</b></div>'+
     '<p style="text-align:center;font-family:\'Space Mono\',monospace;font-size:17px">137 \u00f7 6 = <b>22 r 5</b></p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" id="nx" '+(predictDone?'':'disabled')+' onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
  if(predictDone)el('ph').classList.remove('hide');
}

function checkPredict(v){
  var fb=el('pfb');
  if(v===1){fb.className='fb ok';fb.innerHTML='<b>Right \u2014 1 left.</b> 6 groups take 2 each, which uses 12 of the 13.';}
  else{fb.className='fb no';fb.innerHTML='<b>It is 1.</b> Each of the 6 groups can take 2 tall blocks, which uses 12. That leaves one stranded.';}
  el('ph').classList.remove('hide');predictDone=true;el('nx').disabled=false;
}

/* ---------- BEAT 4 ---------- */
function beat4(){
  var h='';
  h+='<div class="tag">Why</div>';
  h+='<h2>Without the blocks</h2>';
  h+='<table class="t"><tr><th>What you did</th><th>What you write</th></tr>';
  h+='<tr><td>13 tens by 6, 2 each</td><td>6 \u00d7 20 = 120, and 137 \u2212 120 = 17</td></tr>';
  h+='<tr><td>17 ones by 6, 2 each</td><td>6 \u00d7 2 = 12, and 17 \u2212 12 = 5</td></tr>';
  h+='<tr><td>read the groups</td><td>20 + 2 = <b>22</b>, remainder <b>5</b></td></tr></table>';
  h+='<p>Take out big chunks first, then smaller, until what is left is too small to share.</p>';
  h+='<div class="goal"><div class="lab">The words</div>'+
     '<p><b>137 \u00f7 6 = 22 r 5</b><br>'+
     '137 is the <b>dividend</b>, 6 is the <b>divisor</b>, 22 is the <b>quotient</b>, 5 is the <b>remainder</b>.</p></div>';
  h+='<p>Check it: 22 \u00d7 6 = 132, plus 5, is 137.</p>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
}

/* ---------- BEAT 5 ---------- */
function beat5(){
  var h='';
  h+='<div class="tag">Catch the mistake</div>';
  h+='<h2>Ava says 96 \u00f7 4 = 21 remainder 12</h2>';
  h+='<p><i>"2 tall each, 1 tall left. 1 small each, 2 small left. So 21, and my leftover is 1 tall + 2 small = 12."</i></p>';
  h+='<div class="row" style="margin-top:12px"><button class="btn sm" onclick="testAva()">Check it by building back up</button></div>';
  h+='<div id="ah" class="hide"><table class="t"><tr><th>Check</th><th>Result</th></tr>';
  h+='<tr><td>Ava says 21 remainder 12</td><td>21 \u00d7 4 + 12 = <b>96</b> \u2014 that part is fine</td></tr>';
  h+='<tr><td>but her leftover is</td><td><b>12</b>, and there are only <b>4</b> groups</td></tr>';
  h+='<tr><td>so she could keep going</td><td>12 more shared by 4 is 3 each \u2192 21 + 3 = <b>24</b></td></tr></table></div>';
  h+='<div id="afb"></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" id="nx" '+(mistakeTested?'':'disabled')+' onclick="next()">Next →</button></div>';
  el('stage').innerHTML=h;
  if(mistakeTested)testAva();
}
function testAva(){
  el('ah').classList.remove('hide');
  var fb=el('afb');fb.className='fb no';
  fb.innerHTML='<b>Ava stopped too early.</b> Her total adds back to 96, so the arithmetic is fine. The problem is a leftover of <b>12</b> with only <b>4</b> groups \u2014 that still goes round. Keep sharing and you get <b>24</b>. A remainder is only finished when it is smaller than the number of groups.';
  mistakeTested=true;if(el('nx'))el('nx').disabled=false;
}

/* ---------- questions ---------- */
var QUESTIONS=[
  {q:'84 \u00f7 4. You share the 8 tall blocks first. How many does each of the 4 groups get?',
   a:['1','2','4','8'],correct:1,
   why:'8 tall blocks between 4 groups is 2 each, with none stranded.'},
  {q:'Sharing 7 tall blocks between 3 groups leaves 1 stranded. What happens to it?',
   a:['It is the remainder','It is thrown away','It breaks into 10 small blocks and joins the small pile','It goes to the first group'],correct:2,
   why:'A tall block is worth ten small ones. Break it up and it can go round.'},
  {q:'96 \u00f7 4 = ?',a:['21 remainder 1','19','22 remainder 2','24'],correct:3,
   why:'2 tens each with one ten stranded, that ten becomes 10 ones joining the 6 to make 16, then 4 ones each. 2 tens and 4 ones is 24.'},
  {q:'You get 22 remainder 5 for 137 \u00f7 6. How do you check it?',
   a:['Divide 22 by 6','Add 22 and 5','Work out 22 \u00d7 6 + 5 and see if it makes 137','Round 137 to 140'],correct:2,
   why:'22 \u00d7 6 = 132, plus the 5 left over, gives 137. Building it back up should land on what you started with.'},
  {q:'Why can a remainder never be as big as the number of groups?',
   a:['Because remainders are always small','Because it must be less than 10','It can be','Because if it were, every group could take one more'],correct:3,
   why:'If 4 groups had 4 blocks left, each group could take one more. A leftover only survives when there are not enough to go round.'}
];
function beatQ(){
  var Q=QUESTIONS[qIndex],h='';
  h+='<div class="tag">Your turn</div><div class="qcount">Question '+(qIndex+1)+' of '+QUESTIONS.length+'</div>';
  h+='<h2 style="margin-top:10px">'+Q.q+'</h2>';
  for(var i=0;i<Q.a.length;i++)h+='<button class="choice" id="ch'+i+'" onclick="pick('+i+')">'+Q.a[i]+'</button>';
  h+='<div id="qfb"></div>';
  h+='<div class="nav"><span><button class="btn sm" onclick="reviewLesson()">\u2190 Review the lesson</button> <span class="qcount">Score: '+qCorrect+'</span></span><button class="btn" id="nx" disabled onclick="nextQ()">Next →</button></div>';
  el('stage').innerHTML=h;answered=false;
}
function pick(i){
  if(answered)return;answered=true;
  var Q=QUESTIONS[qIndex];
  for(var j=0;j<Q.a.length;j++){var b=el('ch'+j);if(j===Q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong');}
  var fb=el('qfb');
  if(i===Q.correct){qCorrect++;fb.className='fb ok';fb.innerHTML='<b>Correct.</b> '+Q.why;}
  else{fb.className='fb no';fb.innerHTML='<b>No.</b> '+Q.why;}
  el('nx').disabled=false;
}
function reviewLesson(){ step=1; render(); scrollTo(0,0); }
function nextQ(){qIndex++;step=(qIndex>=QUESTIONS.length)?TOTAL-1:5+qIndex;render();scrollTo(0,0);}

function markCourseDone(){
  try{
    var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');
    var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';
    var key='voyage_g4math_progress_'+kid;
    var p={done:{},lastSkill:0};
    var raw=localStorage.getItem(key); if(raw) p=JSON.parse(raw);
    if(!p.done) p.done={};
    p.done['4.NBT.6']=true;
    localStorage.setItem(key,JSON.stringify(p));
  }catch(e){}
}
function beatDone(){
  var pct=Math.round(qCorrect/QUESTIONS.length*100),h='';
  h+='<div class="done-icon">'+(pct>=80?'\u2713':'\u21bb')+'</div>';
  h+='<h2 style="text-align:center">'+(pct>=80?'Lesson complete':'Worth one more pass')+'</h2>';
  h+='<p style="text-align:center;font-family:\'Space Mono\',monospace;color:var(--muted)">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';
  if(pct>=80){markCourseDone();h+='<div class="goal" style="margin-top:18px"><div class="lab">You can now</div><p>Divide by sharing tens first, breaking what will not go round, and saying what the remainder is.</p></div>';}
  else h+='<p style="margin-top:16px">Go back to Ava. She wrote off a stranded ten instead of breaking it up, and lost 10.</p>';
  h+='<div class="nav"><button class="btn sm" onclick="restart()">\u21bb Again</button><button class="btn go" onclick="location.href=\'math-course.html\'">Back to Math →</button></div>';
  h+='<div class="attrib">Task design based on IM\u00ae K\u20135 Math authored by Illustrative Mathematics\u00ae, licensed under CC BY 4.0.</div>';
  el('stage').innerHTML=h;
}
function restart(){step=0;wonCount=0;inited=false;predictDone=false;mistakeTested=false;qIndex=0;qCorrect=0;render();scrollTo(0,0);}

function render(){
  drawSteps();
  if(step===0)beat1();else if(step===1)beat2();else if(step===2)beat3();
  else if(step===3)beat4();else if(step===4)beat5();
  else if(step>=5&&step<TOTAL-1)beatQ();else beatDone();
}
</script>
