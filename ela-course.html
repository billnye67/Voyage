<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage · Grade 4 ELA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;--grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;min-height:100vh}
  .app{display:flex;max-width:1080px;margin:0 auto;min-height:100vh}
  .side{width:290px;flex-shrink:0;border-right:1.5px solid var(--blue-line);padding:22px 16px;background:rgba(251,250,245,.6)}
  .side .brand{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:2px}
  .side .sub{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  #pcount{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px}
  #pbar{height:5px;border-radius:3px;background:var(--blue-line);margin-bottom:6px;overflow:hidden}
  #pfill{height:100%;width:0;background:var(--green);transition:width .3s}
  .domain{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--blue-line)}
  .skill-btn{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:9px 10px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--ink);line-height:1.25;margin-bottom:1px}
  .skill-btn:hover{background:rgba(27,79,138,.07)}
  .skill-btn.active{background:var(--blue);color:#fff;box-shadow:2px 2px 0 rgba(27,79,138,.25)}
  .skill-btn .check{flex-shrink:0;font-size:13px;color:var(--blue-line);width:16px;text-align:center}
  .skill-btn.done .check{color:var(--green)}
  .skill-btn.active .check{color:#fff}
  .skill-btn.done .stitle{color:var(--muted)}
  .skill-btn.active .stitle,.skill-btn.active.done .stitle{color:#fff}
  .stitle{flex:1}
  .lmark{flex-shrink:0;font-size:11px;color:var(--accent)}
  .skill-btn.active .lmark{color:#fff}
  .main{flex:1;padding:26px 30px 60px;min-width:0}
  .crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:28px 26px;min-height:340px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}
  .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.15;margin-bottom:14px}
  .card p{font-size:16px;line-height:1.6;margin-bottom:12px}
  .card p b{font-weight:600}
  .goalbox{background:rgba(27,79,138,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:13px 16px;margin:16px 0}
  .goalbox .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .goalbox p{margin:0;font-size:15.5px}
  .meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--blue-line);border-bottom:1px dashed var(--blue-line);padding:12px 0;margin:18px 0 20px}
  .donebadge{display:inline-block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--green);border:1.5px solid var(--green);border-radius:8px;padding:5px 10px;margin-bottom:14px}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.go{background:var(--accent);color:#fff}
  .btn.ghost{border-color:var(--blue-line);box-shadow:none;color:var(--muted)}
  .btn.sm{font-size:13px;padding:7px 13px;box-shadow:2px 2px 0 var(--ink)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  @media(max-width:760px){.app{flex-direction:column}.side{width:100%;border-right:none;border-bottom:1.5px solid var(--blue-line)}.main{padding:22px 18px 50px}}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">Voyage</div>
    <div class="sub">Grade 4 · Reading & Writing</div>
    <div id="pcount"></div>
    <div id="pbar"><div id="pfill"></div></div>
    <button class="btn ghost sm" id="resetBtn" style="font-size:11px;padding:4px 9px;margin-bottom:10px">Reset progress</button>
    <div id="menu"></div>
  </nav>
  <main class="main">
    <div class="crumb" id="crumb"></div>
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn ghost" id="back">← Previous skill</button>
      <span class="crumb" id="counter" style="margin:0"></span>
      <button class="btn" id="next">Next skill →</button>
    </div>
  </main>
</div>

<script>
const COURSE = {
  subject:"Grade 4 · Reading & Writing",
  domains:[
  { name:"Reading Literature", skills:[
    { code:"RL.4.1", title:"Details & inferences", file:"lesson-rl41-details-inferences.html",
      blurb:"A story tells you some things straight out — and whispers the rest through clues.",
      goal:"Tell right-there answers from inferences, and back every claim with the text’s exact words." },
    { code:"RL.4.2", title:"Theme & summarizing", file:"lesson-rl42-theme-summarize.html",
      blurb:"Shrink a story to its bones, then find the lesson it secretly argues.",
      goal:"Summarize with the five-ingredient recipe and find themes by what the story rewards." },
    { code:"RL.4.3", title:"Characters, settings & events", file:"lesson-rl43-character-setting-events.html",
      blurb:"Who, where, and what happens — three gears that turn each other.",
      goal:"Read traits from patterns of actions and trace why events happen through the gears." },
    { code:"RL.4.4", title:"Word meanings & myth words", file:"lesson-rl44-word-meaning-allusions.html",
      blurb:"Crack strange words from their neighbors — and words that carry whole Greek myths inside.",
      goal:"Use context clues, and decode allusions like Herculean, Pandora’s box, and the Midas touch." },
    { code:"RL.4.5", title:"Poems, drama & prose", file:"lesson-rl45-poems-drama-prose.html",
      blurb:"The same rainy afternoon written three completely different ways.",
      goal:"Tell the three formats apart by their parts: paragraphs, stanzas, and stage directions." },
    { code:"RL.4.6", title:"Point of view", file:"lesson-rl46-point-of-view.html",
      blurb:"Whose eyes you look through changes everything — even what counts as funny.",
      goal:"Spot first vs third person, test what a narrator can know, and never confuse narrator with author." },
    { code:"RL.4.7", title:"Text vs pictures", file:"lesson-rl47-text-vs-visual.html",
      blurb:"The artist read the same story you did — then added a moon and lost a boat.",
      goal:"Compare a story’s words with its illustration: matches, additions, and changes." },
    { code:"RL.4.9", title:"Themes across cultures", file:"lesson-rl49-compare-themes.html",
      blurb:"A Greek lion and a Japanese crane, arguing the exact same lesson.",
      goal:"Strip the cultural costume and compare what tales from different places reward." }
  ]},
  { name:"Reading Informational", skills:[
    { code:"RI.4.1", title:"Facts & inferences", file:"lesson-ri41-details-inferences.html",
      blurb:"The article never says how the octopus escapes — but its facts snap together and tell you.",
      goal:"Point at stated facts and build conclusions you can defend, fact by fact." },
    { code:"RI.4.2", title:"Main idea & key details", file:"lesson-ri42-main-idea.html",
      blurb:"Every paragraph is an umbrella: one big idea keeping its details dry.",
      goal:"Run the umbrella test, tell topic from main idea from detail, and summarize nonfiction." },
    { code:"RI.4.3", title:"What happened & why", file:"lesson-ri43-explain-events.html",
      blurb:"Geysers, railroads, history — nonfiction runs on cause-and-effect chains.",
      goal:"Explain events link by link, keeping every “because” attached and text-based." },
    { code:"RI.4.4", title:"Science words & signals", file:"lesson-ri44-academic-words.html",
      blurb:"Good writers plant definitions right next to their big words — marked with little signals.",
      goal:"Harvest meanings from dashes, colons, and comma phrases; switch meanings by subject." },
    { code:"RI.4.5", title:"Text structure", file:"lesson-ri45-text-structure.html",
      blurb:"Writers pick a shape before they pour the facts — and the shape leaves fingerprints.",
      goal:"Name a text’s structure from its signal words and borrow its shape for notes." },
    { code:"RI.4.6", title:"Firsthand & secondhand", file:"lesson-ri46-firsthand-secondhand.html",
      blurb:"One writer stood on the flooded porch; the other gathered the records two years later.",
      goal:"Tell eyewitnesses from gatherers, and match each account to the questions it can answer." },
    { code:"RI.4.7", title:"Charts & diagrams", file:"lesson-ri47-charts-diagrams.html",
      blurb:"Half the article isn’t in the sentences — the chart and the diagram know things the words don’t.",
      goal:"Read values off charts, decode diagrams, and cite visuals as evidence." },
    { code:"RI.4.8", title:"Reasons & evidence", file:"lesson-ri48-reasons-evidence.html",
      blurb:"Authors build towers: a claim on top, reasons below, evidence at the base.",
      goal:"Map point → reasons → evidence, and spot arguments standing on air." },
    { code:"RI.4.9", title:"Combining two texts", file:"lesson-ri49-integrate-texts.html",
      blurb:"One article knows the penguin dads; a different one knows the moms. Real research merges them.",
      goal:"Merge two texts on one topic: agreements, additions, and honest disagreements." }
  ]},
  { name:"Language", skills:[
    { code:"L.4.1", title:"Sentence hospital", file:"lesson-l41-grammar.html",
      blurb:"Fragments missing half a body, run-ons fused in a crash — you’re the doctor.",
      goal:"Diagnose and fix fragments and run-ons, and keep verbs in the right tense." },
    { code:"L.4.2", title:"Caps, commas & spelling", file:"lesson-l42-caps-commas-spelling.html",
      blurb:"Three proofreading sweeps — and the homophone traps no spell-checker can catch.",
      goal:"Fix capitals, commas, and dialogue punctuation, and swap-test the apostrophe twins." },
    { code:"L.4.3", title:"Precise words", file:"lesson-l43-precise-words.html",
      blurb:"“The dog went across the yard” tells you nothing. One exact word carries a movie frame.",
      goal:"Upgrade placeholder words to match the exact picture — without thesaurus-bombing." },
    { code:"L.4.4", title:"Word parts & context clues", file:"lesson-l44-context-clues-roots.html",
      blurb:"Big words are LEGO: prefix + root + suffix. A handful of pieces unlocks hundreds of words.",
      goal:"Snap words apart, build meanings, and test every guess against the sentence." },
    { code:"L.4.5", title:"Figurative language", file:"lesson-l45-figurative-language.html",
      blurb:"It’s raining cats and dogs, the room is a zoo, and Grandma says hold your horses.",
      goal:"Sort and decode similes, metaphors, idioms, and the advice inside old proverbs." },
    { code:"L.4.6", title:"School direction words", file:"lesson-l46-academic-vocabulary.html",
      blurb:"COMPARE, EXPLAIN, SUMMARIZE — one bossy word decides what job the question wants.",
      goal:"Translate direction words into their exact orders, in every subject." }
  ]},
  { name:"Writing", skills:[
    { code:"W.4.1", title:"Opinion writing", file:"lesson-w41-opinion-writing.html",
      blurb:"Turn “because I want to” into a letter that actually gets answered.",
      goal:"Open with a claim, back it with because-and-example reasons, and land the ending." },
    { code:"W.4.2", title:"Informative writing", file:"lesson-w42-informative-writing.html",
      blurb:"Teach the reader something real — with every fact sorted into the right drawer.",
      goal:"Group facts into one-job paragraphs and keep the teaching voice free of “shoulds.”" },
    { code:"W.4.3", title:"Narrative writing", file:"lesson-w43-narrative-writing.html",
      blurb:"A story is a person, a problem, and what they do about it — not a list of events.",
      goal:"Open with a problem, show feelings instead of naming them, and land an echo ending." }
  ]}
  ]
};

let flat = [];
COURSE.domains.forEach(d => d.skills.forEach(s => flat.push({...s, domain:d.name})));
let si = 0;
const SAVE_KEY = 'voyage_g4ela_progress';
let progress = { done:{}, lastSkill:0 };
function loadProgress(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) progress=JSON.parse(raw); if(!progress.done) progress.done={}; }catch(e){} }
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); }catch(e){} }
function resetProgress(){ progress={done:{},lastSkill:0}; saveProgress(); loadSkill(0); }

function buildMenu(){
  let html='';
  COURSE.domains.forEach(d=>{
    html += `<div class="domain">${d.name}</div>`;
    d.skills.forEach(s=>{
      const idx = flat.findIndex(f=>f.code===s.code);
      html += `<button class="skill-btn" data-i="${idx}"><span class="check">○</span><span class="stitle">${s.title}</span><span class="lmark">◆</span></button>`;
    });
  });
  const m=document.getElementById('menu'); m.innerHTML=html;
  m.addEventListener('click',e=>{ const b=e.target.closest('.skill-btn'); if(b) loadSkill(+b.dataset.i); });
}
function loadSkill(i){ si=i; progress.lastSkill=i; saveProgress(); render(); scrollTo(0,0); }

function render(){
  const s=flat[si];
  const isDone = !!progress.done[s.code];
  document.getElementById('crumb').textContent = `${COURSE.subject}  ›  ${s.domain}`;
  let inner = `<div class="tag">Lesson · ${s.code}</div>`;
  inner += `<h2>${s.title}</h2>`;
  if(isDone) inner += `<div class="donebadge">✔ lesson complete — replay any time</div>`;
  inner += `<p>${s.blurb}</p>`;
  inner += `<div class="goalbox"><div class="lab">You’ll learn to</div><p>${s.goal}</p></div>`;
  inner += `<div class="meta"><span>⏱ ~15 minutes</span><span>✎ 5 questions</span><span>◆ ${s.code}</span></div>`;
  inner += `<button class="btn go" onclick="location.href='${s.file}'">${isDone?'Replay lesson ↻':'Start lesson →'}</button>`;
  document.getElementById('card').innerHTML=inner;

  const doneCount = flat.filter(f=>progress.done[f.code]).length;
  document.getElementById('pcount').textContent=`${doneCount} / ${flat.length} skills complete`;
  document.getElementById('pfill').style.width=(doneCount/flat.length*100)+'%';
  document.getElementById('counter').textContent=`skill ${si+1} / ${flat.length}`;
  document.getElementById('back').style.visibility = si===0?'hidden':'visible';
  document.getElementById('next').style.visibility = si===flat.length-1?'hidden':'visible';
  document.querySelectorAll('.skill-btn').forEach(b=>{
    const idx=+b.dataset.i, d=!!progress.done[flat[idx].code];
    b.classList.toggle('active',idx===si);
    b.classList.toggle('done',d);
    const chk=b.querySelector('.check'); if(chk) chk.textContent=d?'✔':'○';
  });
}

loadProgress();
buildMenu();
document.getElementById('back').addEventListener('click',()=>{ if(si>0) loadSkill(si-1); });
document.getElementById('next').addEventListener('click',()=>{ if(si<flat.length-1) loadSkill(si+1); });
document.getElementById('resetBtn').addEventListener('click',()=>{ if(confirm('Reset all progress?')) resetProgress(); });
loadSkill(Math.min(progress.lastSkill||0, flat.length-1));
</script>
</body>
</html>
