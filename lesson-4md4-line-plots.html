ticklab\">0</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/2</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">5/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">7/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1</div></div></div>", "steps": [{"type": "choice", "prompt": "What value does each small step represent?", "options": ["1/2", "1/4", "1/8", "1/10"], "correct": 2, "why": "Eight equal spaces make eighths.", "wrong": "Count the equal spaces between 0 and 1."}]}, {"context": "Place a measurement of 3/4 on an eighths line.", "visual": "<div class=\"lineplot\"><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">0</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/2</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">5/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">7/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1</div></div></div>", "steps": [{"type": "choice", "prompt": "Which tick is the same amount as 3/4?", "options": ["3/8", "4/8", "5/8", "6/8"], "correct": 3, "why": "3/4 = 6/8, so it lands on the sixth eighth.", "wrong": "Rename fourths as eighths by multiplying top and bottom by 2."}]}, {"context": "Place a measurement of 5/8.", "visual": "<div class=\"lineplot\"><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">0</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/2</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">5/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">7/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1</div></div></div>", "steps": [{"type": "choice", "prompt": "Which labeled tick receives the X?", "options": ["1/2", "5/8", "3/4", "7/8"], "correct": 1, "why": "5/8 is already written in the line plot\u2019s unit.", "wrong": "Use the fifth eighth from zero."}]}, {"context": "This plot shows seven ribbon lengths.", "visual": "<div class=\"lineplot\"><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">0</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/8</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">1/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/8</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">1/2</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">5/8</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">3/4</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">7/8</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">1</div></div></div>", "steps": [{"type": "input", "prompt": "How many ribbons measure 3/4?", "answers": ["2"], "placeholder": "number of Xs", "why": "3/4 is 6/8, and two Xs are stacked there.", "wrong": "Find 6/8, then count only the Xs above that tick."}, {"type": "input", "prompt": "What is the difference between the longest and shortest lengths?", "answers": ["3/4", "6/8"], "placeholder": "fraction", "why": "1 \u2212 1/4 = 3/4.", "wrong": "The longest is 1 and the shortest is 1/4."}]}];var WHAT={"heading": "Every X is one data value", "body": "<p>The tick spacing tells the unit. A line split into halves cannot precisely show eighths; a line split into eighths can show halves, fourths, and eighths.</p><div class=\"goal\"><div class=\"lab\">Equivalent locations</div><p>1/2 = 4/8 and 3/4 = 6/8, so those fractions share the same ticks.</p></div>"};var PREDICT={"heading": "Find the tick before counting Xs", "visual": "<div class=\"lineplot\"><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">0</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">1/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1/4</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">3/8</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">1/2</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">5/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">3/4</div></div><div class=\"tick\"><div class=\"xstack\"><span class=\"xmark\">\u00d7</span></div><div class=\"tickline\"></div><div class=\"ticklab\">7/8</div></div><div class=\"tick\"><div class=\"xstack\"></div><div class=\"tickline\"></div><div class=\"ticklab\">1</div></div></div>", "prompt": "How many measurements equal 3/8?", "options": ["1", "2", "3", "4"], "correct": 1, "why": "Two Xs are stacked above the 3/8 tick.", "reveal": "<div class=\"goal\"><div class=\"lab\">Do not count neighboring ticks</div><p>Only Xs directly above 3/8 belong to that value.</p></div>"};var WHY={"heading": "A line plot preserves both value and frequency", "body": "<p>The horizontal position shows the measurement. The vertical stack shows how many times that measurement occurred.</p><p>To compare longest and shortest, subtract their positions\u2014not the number of Xs.</p>"};var MISTAKE={"heading": "Maya says the tallest stack is the longest measurement", "body": "<p>She looked only at stack height.</p>", "button": "Show the two meanings", "reveal": "<div class=\"feedback no\"><b>Height means frequency; rightmost position means greatest value.</b> A tall stack can still sit over a short measurement.</div>"};var QUESTIONS=[{"q": "A 0-to-1 line has 4 equal spaces. Each step is...", "a": ["1/8", "1/4", "1/2", "1/5"], "correct": 1, "why": "Four equal spaces divide the whole into fourths."}, {"q": "On an eighths plot, where does 1/2 go?", "a": ["2/8", "3/8", "4/8", "5/8"], "correct": 2, "why": "1/2 = 4/8."}, {"q": "Three Xs are above 5/8. How many measurements equal 5/8?", "a": ["3", "5", "8", "13"], "correct": 0, "why": "Each X represents one measurement."}, {"q": "Longest is 7/8 and shortest is 2/8. Difference?", "a": ["9/8", "5/8", "5/16", "1/8"], "correct": 1, "why": "7/8 \u2212 2/8 = 5/8."}, {"q": "Which tells how often a value occurred?", "a": ["The denominator", "The rightmost tick", "The height of the X stack", "The length of the number line"], "correct": 2, "why": "Each X is one occurrence, so stack height gives frequency."}];
var step=0,TOTAL=11,taskIndex=0,taskStep=0,challengeDone=false,feedback='',qIndex=0,qCorrect=0,answered=false;

function renderChallenge(){
 var h='<div class="tag">Challenge</div><h2>'+CHALLENGE_TITLE+'</h2>';

 h+='<div class="challenge-list">';for(var i=0;i<TASKS.length;i++)h+='<div class="challenge-chip '+(i<taskIndex?'done':i===taskIndex&&!challengeDone?'now':'')+'">'+(i<taskIndex?'✓ ':'')+'Round '+(i+1)+'</div>';h+='</div>';

   else if(S.type==='multi'){h+='<div class="checkgrid">';for(var k=0;k<S.options.length;k++)h+='<label class="checkopt"><input type="checkbox" name="multi" value="'+k+'"> '+S.options[k]+'</label>';h+='</div><div class="inputrow"><button class="btn sm go" onclick="submitMulti()">Check choices</button></div>'}

function chooseStep(i){var S=TASKS[taskIndex].steps[taskStep];if(i===S.correct)advanceStep(S.why);else{feedback='✗ '+(S.wrong||'That does not match the quantities shown. Try another decision.');renderChallenge()}}
function submitInput(){var S=TASKS[taskIndex].steps[taskStep],v=(el('stepin').value||'').trim();if(!v)return;var ans=S.answers||[S.answer],ok=ans.some(function(a){return norm(v)===norm(a)});if(ok)advanceStep(S.why);else{feedback='✗ '+(S.wrong||'Recheck the operation, units, and arithmetic.');renderChallenge()}}
function submitMulti(){var S=TASKS[taskIndex].steps[taskStep],got=Array.from(document.querySelectorAll('input[name=multi]:checked')).map(function(x){return +x.value}).sort(),want=S.correct.slice().sort();var ok=got.length===want.length&&got.every(function(v,i){return v===want[i]});if(ok)advanceStep(S.why);else{feedback='✗ '+(S.wrong||'Use the properties you can prove from the figure, then try again.');renderChallenge()}}
function renderInfo(obj,tag){var h='<div class="tag">'+tag+'</div><h2>'+obj.heading+'</h2>'+obj.body+'<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" onclick="next()">Next →</button></div>';el('stage').innerHTML=h}
var predictDone=false;
function renderPredict(){var P=PREDICT,h='<div class="tag">Predict first</div><h2>'+P.heading+'</h2>'+P.visual+'<div class="ask"><div class="q">'+P.prompt+'</div>';for(var i=0;i<P.options.length;i++)h+='<button class="stepchoice" onclick="pickPredict('+i+')">'+P.options[i]+'</button>';h+='<div id="pfb"></div></div>';if(predictDone)h+=P.reveal;h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" '+(predictDone?'':'disabled')+' onclick="next()">Next →</button></div>';el('stage').innerHTML=h}
function pickPredict(i){predictDone=true;renderPredict();var f=el('pfb');f.className='feedback '+(i===PREDICT.correct?'ok':'no');f.innerHTML=(i===PREDICT.correct?'✓ ':'✗ ')+PREDICT.why}
var mistakeDone=false;
function renderMistake(){var M=MISTAKE,h='<div class="tag">Catch the mistake</div><h2>'+M.heading+'</h2>'+M.body+'<div class="inputrow"><button class="btn sm" onclick="showMistake()">'+M.button+'</button></div>';if(mistakeDone)h+=M.reveal;h+='<div class="nav"><button class="btn sm" onclick="back()">← Back</button><button class="btn" '+(mistakeDone?'':'disabled')+' onclick="next()">Next →</button></div>';el('stage').innerHTML=h}
function showMistake(){mistakeDone=true;renderMistake()}
function renderQuestion(){var Q=QUESTIONS[qIndex],h='<div class="tag">Your turn</div><div class="qcount">Question '+(qIndex+1)+' of '+QUESTIONS.length+'</div><h2 style="margin-top:10px">'+Q.q+'</h2>';for(var i=0;i<Q.a.length;i++)h+='<button class="choice" id="ch'+i+'" onclick="pickQ('+i+')">'+Q.a[i]+'</button>';h+='<div id="qfb"></div><div class="nav"><button class="btn sm" onclick="reviewLesson()">← Review teaching</button><span class="qcount">Score: '+qCorrect+'</span><button class="btn" id="qnext" disabled onclick="nextQ()">Next →</button></div>';el('stage').innerHTML=h;answered=false}
function pickQ(i){if(answered)return;answered=true;var Q=QUESTIONS[qIndex];for(var j=0;j<Q.a.length;j++){var b=el('ch'+j);if(j===Q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')}var f=el('qfb');f.className='feedback '+(i===Q.correct?'ok':'no');f.innerHTML=(i===Q.correct?'✓ Correct. ':'✗ Not quite. ')+Q.why;if(i===Q.correct)qCorrect++;el('qnext').disabled=false}
function nextQ(){qIndex++;step=qIndex>=QUESTIONS.length?TOTAL-1:5+qIndex;render();scrollTo(0,0)}
function reviewLesson(){step=0;render();scrollTo(0,0)}
function markCourseDone(){try{var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';var key='voyage_g4math_progress_'+kid;var p={done:{},lastSkill:0};var raw=localStorage.getItem(key);if(raw)p=JSON.parse(raw);if(!p.done)p.done={};p.done[CODE]=true;localStorage.setItem(key,JSON.stringify(p))}catch(e){}}
function renderDone(){var pct=Math.round(qCorrect/QUESTIONS.length*100),pass=pct>=80,h='<div class="done-icon">'+(pass?'✓':'↻')+'</div><h2 style="text-align:center">'+(pass?'Lesson complete':'Worth one more pass')+'</h2><p style="text-align:center" class="qcount">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';if(pass){markCourseDone();h+='<div class="goal"><div class="lab">You can now</div><p>'+DONE_TEXT+'</p></div>'}else h+='<p>Review the teaching, then try the questions again.</p>';h+='<div class="nav"><button class="btn sm" onclick="restart()">↻ Again</button><button class="btn go" onclick="goCourse()">Back to Math →</button></div><div class="attrib">Task design based on IM® K–5 Math authored by Illustrative Mathematics®, licensed under CC BY 4.0.</div>';el('stage').innerHTML=h}
function goCourse(){location.href='math-course.html'}
function restart(){step=0;taskIndex=0;taskStep=0;challengeDone=false;feedback='';predictDone=false;mistakeDone=false;qIndex=0;qCorrect=0;answered=false;render();scrollTo(0,0)}
function render(){drawSteps();if(step===0)renderChallenge();else if(step===1)renderInfo(WHAT,'What just happened');else if(step===2)renderPredict();else if(step===3)renderInfo(WHY,'Why');else if(step===4)renderMistake();else if(step>=5&&step<TOTAL-1)renderQuestion();else renderDone()}
</script></body></html>
