<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage · Converting units</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3f0e6;--ink:#16233a;--blue:#1b4f8a;--blue-line:#b9cbdf;--accent:#f0663f;--muted:#5d6b7e;
    --grid:rgba(27,79,138,.10);--card:#fbfaf5;--green:#2e7d5b;--fill:#3a7ca5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;min-height:100vh}
  .shell{max-width:740px;margin:0 auto;padding:26px 22px 80px}
  .crumb{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1.5px solid var(--blue-line);border-radius:16px;padding:30px 28px;box-shadow:4px 4px 0 rgba(27,79,138,.08)}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:31px;line-height:1.12;margin-bottom:12px}
  h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.22;margin-bottom:14px}
  p{font-size:16.5px;line-height:1.6;margin-bottom:12px}
  b{font-weight:600}
  .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .meta{display:flex;gap:22px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--blue-line);border-bottom:1px dashed var(--blue-line);padding:12px 0;margin:20px 0 22px}
  .goal{background:rgba(27,79,138,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 17px;margin:16px 0}
  .goal .lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .goal p{margin:0;font-size:16px}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;padding:12px 22px;border-radius:10px;
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.go{background:var(--accent);color:#fff}
  .btn.sm{font-size:13.5px;padding:8px 14px;box-shadow:2px 2px 0 var(--ink)}
  .btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps .seg{height:5px;border-radius:3px;flex:1;background:var(--blue-line)}
  .steps .seg.on{background:var(--blue)}
  .hide{display:none}
  .chal{background:#fff;border:2px solid var(--blue-line);border-radius:10px;padding:13px 16px;margin:10px 0;transition:.2s}
  .chal.locked{opacity:.4}
  .chal.won{border-color:var(--green);background:rgba(46,125,91,.07)}
  .chalnum{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .chal.won .chalnum{color:var(--green)}
  .chaltxt{font-size:16px;line-height:1.45}
  .chalstate{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-top:7px}
  .chal.won .chalstate{color:var(--green);font-weight:700}
  /* the measure */
  .fact{font-family:'Space Mono',monospace;font-size:14.5px;background:rgba(27,79,138,.08);border-left:3px solid var(--blue);
    border-radius:0 8px 8px 0;padding:10px 14px;margin:4px 0 6px;color:var(--ink)}
  .gauge{background:#fff;border:2.5px solid var(--ink);border-radius:10px;height:64px;position:relative;overflow:hidden;margin:16px 0 6px}
  .gfill{position:absolute;left:0;top:0;bottom:0;background:var(--fill);transition:width .3s}
  .gfill.over{background:var(--accent)}
  .gmark{position:absolute;top:-4px;bottom:-4px;border-left:3px dashed var(--ink);z-index:3}
  .greading{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;text-align:center;margin-top:8px}
  .greading small{font-size:13px;color:var(--muted);font-weight:400}
  .pours{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
  .pour{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;padding:10px 14px;border-radius:9px;
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .pour:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .tally{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);text-align:center;margin-top:10px;min-height:20px}
  .verdict{font-size:15.5px;font-weight:600;padding:11px 15px;border-radius:9px;margin-top:12px;min-height:44px;display:flex;align-items:center}
  .verdict.over{background:rgba(240,102,63,.11);color:var(--accent)}
  .verdict.exact{background:rgba(46,125,91,.13);color:var(--green)}
  .ask{background:#fff;border:1.5px dashed var(--blue-line);border-radius:12px;padding:18px;margin:16px 0}
  .ask .q{font-size:16.5px;font-weight:600;margin-bottom:12px;line-height:1.45}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  input[type=text]{font-family:'Space Mono',monospace;font-size:19px;width:110px;padding:9px 10px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;text-align:center}
  .fb{margin-top:12px;font-size:15.5px;line-height:1.5;padding:11px 14px;border-radius:9px}
  .fb.ok{background:rgba(46,125,91,.12);color:var(--green)}
  .fb.no{background:rgba(240,102,63,.12);color:var(--accent)}
  table.t{width:100%;border-collapse:collapse;margin:14px 0;font-family:'Space Mono',monospace;font-size:14.5px}
  table.t th,table.t td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--blue-line)}
  table.t th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--blue-line);border-radius:10px;
    padding:12px 15px;font-family:'Space Grotesk',sans-serif;font-size:15.5px;color:var(--ink);cursor:pointer;margin-bottom:9px;line-height:1.4}
  .choice:hover{border-color:var(--blue);background:rgba(27,79,138,.05)}
  .choice.right{border-color:var(--green);background:rgba(46,125,91,.10)}
  .choice.wrong{border-color:var(--accent);background:rgba(240,102,63,.10)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .qcount{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .done-icon{font-size:44px;text-align:center;margin-bottom:8px}
  .attrib{font-size:12px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.5}
  @media(max-width:620px){.shell{padding:20px 15px 60px}.card{padding:24px 18px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="shell">

<div id="intro">
  <div class="crumb">Grade 4 Math &nbsp;›&nbsp; Measurement</div>
  <div class="card">
    <div class="tag">Lesson · 4.MD.A.1</div>
    <h1>Converting units</h1>
    <p>A litre jug and a 100 ml cup fill the same tank — you just need different numbers of them. Hit the exact mark using whichever containers you're given.</p>
    <div class="meta"><span>⏱ ~15 minutes</span><span>✎ 5 questions</span><span>◆ 4.MD.A.1</span></div>
    <button class="btn go" onclick="startLesson()">Start lesson →</button>
  </div>
</div>

<div id="lesson" class="hide">
  <div class="crumb">Grade 4 Math &nbsp;›&nbsp; Converting units</div>
  <div class="steps" id="steps"></div>
  <div class="card" id="stage"></div>
</div>

</div>

<script>
var step=0,TOTAL=11;
var TASKS=[
  {target:2500,unit:'ml',label:'2 litres 500 ml',
   fact:'1 litre = 1,000 ml',
   tools:[{n:'1 litre',v:1000},{n:'100 ml',v:100}]},
  {target:240,unit:'cm',label:'2 metres 40 cm',
   fact:'1 metre = 100 cm. A different pair, so a different number.',
   tools:[{n:'1 metre',v:100},{n:'10 cm',v:10},{n:'1 cm',v:1}]},
  {target:200,unit:'min',label:'3 hours 20 minutes',
   fact:'1 hour = 60 min. Not 100 \u2014 clocks run in sixties.',
   tools:[{n:'1 hour',v:60},{n:'10 min',v:10},{n:'1 min',v:1}]}
];
var wonCount=0,amount=0,used=[];
var predictDone=false,mistakeTested=false;
var qIndex=0,qCorrect=0,answered=false;

function el(i){return document.getElementById(i);}
function startLesson(){el('intro').classList.add('hide');el('lesson').classList.remove('hide');render();scrollTo(0,0);}
function drawSteps(){var h='';for(var i=0;i<TOTAL;i++)h+='<div class="seg'+(i<=step?' on':'')+'"></div>';el('steps').innerHTML=h;}
function next(){step++;render();scrollTo(0,0);}
function back(){if(step>0){step--;render();scrollTo(0,0);}}
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}

/* ---------- BEAT 1 ---------- */
function beat1(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],h='';
  h+='<div class="tag">Challenge '+(Math.min(wonCount,2)+1)+' of 3</div>';
  h+='<h2>Fill it to exactly '+T.label+'</h2>';
  h+='<div class="fact">'+T.fact+'</div>';

  var pct=Math.min(amount/T.target*100,100), over=amount>T.target;
  h+='<div class="gauge"><div class="gfill'+(over?' over':'')+'" style="width:'+pct+'%"></div>';
  h+='<div class="gmark" style="left:100%"></div></div>';
  h+='<div class="greading">'+fmt(amount)+' '+T.unit+' <small>/ '+fmt(T.target)+' '+T.unit+'</small></div>';

  h+='<div class="pours">';
  T.tools.forEach(function(t,i){
    h+='<button class="pour" onclick="add('+i+')">+ '+t.n+'</button>';
  });
  h+='<button class="pour" onclick="clr()">empty</button>';
  h+='<button class="pour" style="background:var(--accent);color:#fff" onclick="lockIn()">Lock it in</button>';
  h+='</div>';
  var lines={};
  used.forEach(function(u){lines[u]=(lines[u]||0)+1;});
  var parts=[];
  Object.keys(lines).forEach(function(k){
    var t=null;T.tools.forEach(function(x){if(x.n===k)t=x;});
    parts.push(lines[k]+' \u00d7 '+k+' = '+fmt(lines[k]*t.v)+' '+T.unit);
  });
  h+='<div class="tally">'+(parts.length?parts.join('<br>')+'<br><b>total '+fmt(amount)+' '+T.unit+'</b>':'')+'</div>';
  h+='<div class="verdict" id="v"></div>';

  for(var i=0;i<TASKS.length;i++){
    var t=TASKS[i];
    var cls=i<wonCount?'chal won':(i===wonCount?'chal':'chal locked');
    var st=i<wonCount?'\u2713 done':(i===wonCount?'now':'locked');
    h+='<div class="'+cls+'"><div class="chalnum">Challenge '+(i+1)+'</div><div class="chaltxt">'+t.label+'</div><div class="chalstate">'+st+'</div></div>';
  }
  h+='<div class="nav"><span></span><button class="btn" id="nx" '+(wonCount>=3?'':'disabled')+' onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
  var v=el('v');v.className='verdict';
  v.textContent=amount===0?'':(amount>T.target?'Over the mark.':'');
}
function add(i){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)];
  amount+=T.tools[i].v; used.push(T.tools[i].n); beat1();
}
function clr(){amount=0;used=[];beat1();}
function lockIn(){
  var T=TASKS[Math.min(wonCount,TASKS.length-1)],v=el('v');
  if(amount===0)return;
  if(amount===T.target){
    v.className='verdict exact';
    v.innerHTML='\u2713 '+T.label+' = <b>'+fmt(T.target)+' '+T.unit+'</b>';
    wonCount++;amount=0;used=[];
    if(wonCount>=3&&el('nx'))el('nx').disabled=false;
    setTimeout(function(){if(step===0)beat1();},1900);
  } else {
    v.className='verdict over';
    v.innerHTML='\u2717 That is '+fmt(amount)+' '+T.unit+', not '+fmt(T.target)+'. '+
      (amount>T.target?'Empty it and start again.':'Keep adding.');
  }
}

/* ---------- BEAT 2 ---------- */
function beat2(){
  var h='';
  h+='<div class="tag">Worked example</div>';
  h+='<h2>Turning 3 litres into millilitres</h2>';
  h+='<p>You know one fact: <b>1 litre = 1,000 ml</b>. That is the only thing you need.</p>';
  h+='<table class="t"><tr><th>Step</th><th>Working</th></tr>';
  h+='<tr><td>How many ml in one litre?</td><td>1,000</td></tr>';
  h+='<tr><td>How many litres have you got?</td><td>3</td></tr>';
  h+='<tr><td>So how many ml altogether?</td><td>3 \u00d7 1,000 = <b>3,000 ml</b></td></tr></table>';
  h+='<p>That is the whole method. Find how many small units fit in one big unit, then multiply by how many big units you have.</p>';
  h+='<div class="goal"><div class="lab">Try it on a different pair</div>'+
     '<p>A metre is <b>100 cm</b>. So 6 metres is 6 \u00d7 100 = <b>600 cm</b>.<br>'+
     'An hour is <b>60 min</b>. So 4 hours is 4 \u00d7 60 = <b>240 min</b>.</p></div>';
  h+='<h2 style="margin-top:26px">The facts worth knowing</h2>';
  h+='<table class="t"><tr><th>One of these</th><th>holds this many</th></tr>';
  h+='<tr><td>1 litre</td><td>1,000 millilitres</td></tr>';
  h+='<tr><td>1 kilogram</td><td>1,000 grams</td></tr>';
  h+='<tr><td>1 kilometre</td><td>1,000 metres</td></tr>';
  h+='<tr><td>1 metre</td><td>100 centimetres</td></tr>';
  h+='<tr><td>1 hour</td><td>60 minutes</td></tr>';
  h+='<tr><td>1 minute</td><td>60 seconds</td></tr>';
  h+='<tr><td>1 pound</td><td>16 ounces</td></tr>';
  h+='<tr><td>1 foot</td><td>12 inches</td></tr></table>';
  h+='<p>The number is different for every pair. That is the part people get wrong.</p>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
}

/* ---------- BEAT 3 ---------- */
function beat3(){
  var h='';
  h+='<div class="tag">Predict first</div>';
  h+='<h2>4 kilograms of flour</h2>';
  h+='<div class="ask"><div class="q">How many grams is that?</div>';
  h+='<div class="row"><input type="text" id="pred" placeholder="?"><button class="btn sm" onclick="checkPredict()">Check it</button></div>';
  h+='<div id="pfb"></div></div>';
  h+='<div id="ph" class="hide"><table class="t"><tr><th>kg</th><th>g</th></tr>';
  h+='<tr><td>1</td><td>1,000</td></tr><tr><td>2</td><td>2,000</td></tr><tr><td>3</td><td>3,000</td></tr><tr><td>4</td><td><b>4,000</b></td></tr></table>';
  h+='<p>Each kilogram is 1,000 grams, so 4 of them is 4 \u00d7 1,000.</p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" id="nx" '+(predictDone?'':'disabled')+' onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
  if(predictDone)el('ph').classList.remove('hide');
}
function checkPredict(){
  var raw=(el('pred').value||'').replace(/[\s,]/g,'');
  var fb=el('pfb');
  if(raw==='4000'){fb.className='fb ok';fb.innerHTML='<b>Yes \u2014 4,000 g.</b>';}
  else if(raw==='400'){fb.className='fb no';fb.innerHTML='<b>That is the hundreds factor.</b> Kilograms to grams is \u00d7 1,000, so <b>4,000 g</b>.';}
  else{fb.className='fb no';fb.innerHTML='<b>Not quite.</b> 1 kg is 1,000 g, so 4 kg is <b>4,000 g</b>.';}
  el('ph').classList.remove('hide');predictDone=true;el('nx').disabled=false;
}

/* ---------- BEAT 4 ---------- */
function beat4(){
  var h='';
  h+='<div class="tag">Why</div>';
  h+='<h2>Going down a unit means multiplying</h2>';
  h+='<p>A smaller unit means more of them fit, so the number gets bigger. Multiply by how many fit in one.</p>';
  h+='<table class="t"><tr><th>Going</th><th>Do this</th><th>Example</th></tr>';
  h+='<tr><td>big \u2192 small</td><td>multiply</td><td>3 m = 3 \u00d7 100 = 300 cm</td></tr>';
  h+='<tr><td>small \u2192 big</td><td>divide</td><td>500 cm = 500 \u00f7 100 = 5 m</td></tr></table>';
  h+='<div class="goal"><div class="lab">The trap</div><p>The number you multiply by <b>changes with the unit</b>. Litres to millilitres is 1,000. Hours to minutes is 60. Feet to inches is 12. There is no single conversion number.</p></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
}

/* ---------- BEAT 5 ---------- */
function beat5(){
  var h='';
  h+='<div class="tag">Catch the mistake</div>';
  h+='<h2>Rosa says 3 hours = 300 minutes</h2>';
  h+='<p><i>"You multiply by 100 to go to the smaller unit."</i></p>';
  h+='<div class="row" style="margin-top:12px"><button class="btn sm" onclick="testRosa()">Count the hours</button></div>';
  h+='<div id="rh" class="hide"><table class="t"><tr><th>Hours</th><th>Minutes</th></tr>';
  h+='<tr><td>1</td><td>60</td></tr><tr><td>2</td><td>120</td></tr><tr><td>3</td><td><b>180</b></td></tr></table></div>';
  h+='<div id="rfb"></div>';
  h+='<div class="nav"><button class="btn sm" onclick="back()">\u2190 Back</button><button class="btn" id="nx" '+(mistakeTested?'':'disabled')+' onclick="next()">Next \u2192</button></div>';
  el('stage').innerHTML=h;
  if(mistakeTested)testRosa();
}
function testRosa(){
  el('rh').classList.remove('hide');
  var fb=el('rfb');fb.className='fb no';
  fb.innerHTML='<b>Rosa used the wrong number.</b> An hour is 60 minutes, not 100, so 3 hours is <b>180</b>. Her answer of 300 would be five hours. The multiplier is whatever fits in one \u2014 and for time that is 60.';
  mistakeTested=true;if(el('nx'))el('nx').disabled=false;
}

/* ---------- questions ---------- */
var QUESTIONS=[
  {q:'How many centimetres in 7 metres?',a:['70','700','7,000','0.07'],correct:1,
   why:'100 cm fit in a metre, so 7 \u00d7 100 = 700.'},
  {q:'How many minutes in 5 hours?',a:['500','50','300','360'],correct:2,
   why:'60 minutes fit in an hour, so 5 \u00d7 60 = 300.'},
  {q:'A bottle holds 2 litres. How many millilitres?',a:['200','20,000','2,000','20'],correct:2,
   why:'1,000 ml fit in a litre, so 2 \u00d7 1,000 = 2,000.'},
  {q:'Going from a big unit to a small one, the number...',
   a:['gets bigger','gets smaller','stays the same','depends on the day'],correct:0,
   why:'Smaller units means more of them fit, so you need a bigger number of them.'},
  {q:'Why can you not use one conversion number for everything?',
   a:['You can, it is always 100','Because each pair of units has its own number that fits','Because metric and imperial are the same','Because bigger units are rarer'],correct:1,
   why:'A litre holds 1,000 ml but an hour holds only 60 minutes. The number comes from the units, not a rule.'}
];
function beatQ(){
  var Q=QUESTIONS[qIndex],h='';
  h+='<div class="tag">Your turn</div><div class="qcount">Question '+(qIndex+1)+' of '+QUESTIONS.length+'</div>';
  h+='<h2 style="margin-top:10px">'+Q.q+'</h2>';
  for(var i=0;i<Q.a.length;i++)h+='<button class="choice" id="ch'+i+'" onclick="pick('+i+')">'+Q.a[i]+'</button>';
  h+='<div id="qfb"></div>';
  h+='<div class="nav"><span><button class="btn sm" onclick="reviewLesson()">\u2190 Review the lesson</button> <span class="qcount">Score: '+qCorrect+'</span></span><button class="btn" id="nx" disabled onclick="nextQ()">Next \u2192</button></div>';
  el('stage').innerHTML=h;answered=false;
}
function pick(i){
  if(answered)return;answered=true;
  var Q=QUESTIONS[qIndex];
  for(var j=0;j<Q.a.length;j++){var b=el('ch'+j);if(j===Q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong');}
  var fb=el('qfb');
  if(i===Q.correct){qCorrect++;fb.className='fb ok';fb.innerHTML='<b>Correct.</b> '+Q.why;}
  else{fb.className='fb no';fb.innerHTML='<b>No.</b> '+Q.why;}
  el('nx').disabled=false;
}
function reviewLesson(){ step=1; render(); scrollTo(0,0); }
function nextQ(){qIndex++;step=(qIndex>=QUESTIONS.length)?TOTAL-1:5+qIndex;render();scrollTo(0,0);}

function markCourseDone(){
  try{
    var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');
    var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';
    var key='voyage_g4math_progress_'+kid;
    var p={done:{},lastSkill:0};
    var raw=localStorage.getItem(key); if(raw) p=JSON.parse(raw);
    if(!p.done) p.done={};
    p.done['4.MD.1']=true;
    localStorage.setItem(key,JSON.stringify(p));
  }catch(e){}
}
function beatDone(){
  var pct=Math.round(qCorrect/QUESTIONS.length*100),h='';
  h+='<div class="done-icon">'+(pct>=80?'\u2713':'\u21bb')+'</div>';
  h+='<h2 style="text-align:center">'+(pct>=80?'Lesson complete':'Worth one more pass')+'</h2>';
  h+='<p style="text-align:center;font-family:\'Space Mono\',monospace;color:var(--muted)">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';
  if(pct>=80){markCourseDone();h+='<div class="goal" style="margin-top:18px"><div class="lab">You can now</div><p>Convert between units by multiplying by however many of the small unit fit in the big one.</p></div>';}
  else h+='<p style="margin-top:16px">Go back to Rosa. She used 100 when an hour holds 60.</p>';
  h+='<div class="nav"><button class="btn sm" onclick="restart()">\u21bb Again</button><button class="btn go" onclick="location.href=\'math-course.html\'">Back to Math \u2192</button></div>';
  h+='<div class="attrib">Task design based on IM\u00ae K\u20135 Math authored by Illustrative Mathematics\u00ae, licensed under CC BY 4.0.</div>';
  el('stage').innerHTML=h;
}
function restart(){step=0;wonCount=0;amount=0;used=[];predictDone=false;mistakeTested=false;qIndex=0;qCorrect=0;render();scrollTo(0,0);}

function render(){
  drawSteps();
  if(step===0)beat1();else if(step===1)beat2();else if(step===2)beat3();
  else if(step===3)beat4();else if(step===4)beat5();
  else if(step>=5&&step<TOTAL-1)beatQ();else beatDone();
}
</script>
</body>
