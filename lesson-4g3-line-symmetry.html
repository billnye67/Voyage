<script>var CODE="4.G.3",CHALLENGE_TITLE="Test each candidate fold",DONE_TEXT="Identify and draw lines of symmetry by using the fold test.";var TASKS=[{"context": "Candidate lines A\u2013D cross a non-square rectangle. Select every line of symmetry.", "visual": "<div class=\"diagram\"><svg viewBox=\"0 0 420 235\"><rect x=\"85\" y=\"55\" width=\"250\" height=\"120\" fill=\"rgba(27,79,138,.08)\" stroke=\"var(--blue)\" stroke-width=\"4\"/>\n      <line x1=\"210\" y1=\"15\" x2=\"210\" y2=\"220\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"218\" y=\"28\" class=\"svglabel\">A</text>\n      <line x1=\"35\" y1=\"115\" x2=\"385\" y2=\"115\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"370\" y=\"107\" class=\"svglabel\">B</text>\n      <line x1=\"70\" y1=\"210\" x2=\"350\" y2=\"20\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"32\" class=\"svglabel\">C</text>\n      <line x1=\"70\" y1=\"20\" x2=\"350\" y2=\"210\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"205\" class=\"svglabel\">D</text>\n    </svg></div>", "steps": [{"type": "multi", "prompt": "Which folds make matching halves?", "options": ["A: vertical", "B: horizontal", "C: one diagonal", "D: the other diagonal"], "correct": [0, 1], "why": "Vertical and horizontal folds match; the diagonals swap unequal side lengths.", "wrong": "Imagine folding the actual rectangle, not a square."}]}, {"context": "Candidate lines A\u2013D cross a square. Select every line of symmetry.", "visual": "<div class=\"diagram\"><svg viewBox=\"0 0 420 235\"><rect x=\"125\" y=\"30\" width=\"170\" height=\"170\" fill=\"rgba(27,79,138,.08)\" stroke=\"var(--blue)\" stroke-width=\"4\"/>\n      <line x1=\"210\" y1=\"15\" x2=\"210\" y2=\"220\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"218\" y=\"28\" class=\"svglabel\">A</text>\n      <line x1=\"35\" y1=\"115\" x2=\"385\" y2=\"115\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"370\" y=\"107\" class=\"svglabel\">B</text>\n      <line x1=\"70\" y1=\"210\" x2=\"350\" y2=\"20\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"32\" class=\"svglabel\">C</text>\n      <line x1=\"70\" y1=\"20\" x2=\"350\" y2=\"210\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"205\" class=\"svglabel\">D</text>\n    </svg></div>", "steps": [{"type": "multi", "prompt": "Which folds make matching halves?", "options": ["A: vertical", "B: horizontal", "C: one diagonal", "D: the other diagonal"], "correct": [0, 1, 2, 3], "why": "A square matches across its vertical, horizontal, and both diagonal folds.", "wrong": "All four candidate folds pair equal sides and equal angles in a square."}]}, {"context": "Candidate lines A\u2013D cross an isosceles triangle.", "visual": "<div class=\"diagram\"><svg viewBox=\"0 0 420 235\"><polygon points=\"210,30 80,195 340,195\" fill=\"rgba(27,79,138,.08)\" stroke=\"var(--blue)\" stroke-width=\"4\"/>\n      <line x1=\"210\" y1=\"15\" x2=\"210\" y2=\"220\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"218\" y=\"28\" class=\"svglabel\">A</text>\n      <line x1=\"35\" y1=\"115\" x2=\"385\" y2=\"115\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"370\" y=\"107\" class=\"svglabel\">B</text>\n      <line x1=\"70\" y1=\"210\" x2=\"350\" y2=\"20\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"32\" class=\"svglabel\">C</text>\n      <line x1=\"70\" y1=\"20\" x2=\"350\" y2=\"210\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"205\" class=\"svglabel\">D</text>\n    </svg></div>", "steps": [{"type": "multi", "prompt": "Which line is a symmetry line?", "options": ["A: vertical", "B: horizontal", "C: one diagonal", "D: the other diagonal"], "correct": [0], "why": "Only the vertical fold sends the two equal sloping sides onto each other.", "wrong": "The fold must pass through the top vertex and the midpoint of the base."}]}, {"context": "This scalene triangle has three unequal sides.", "visual": "<div class=\"diagram\"><svg viewBox=\"0 0 420 235\"><polygon points=\"145,25 55,195 355,175\" fill=\"rgba(27,79,138,.08)\" stroke=\"var(--blue)\" stroke-width=\"4\"/>\n      <line x1=\"210\" y1=\"15\" x2=\"210\" y2=\"220\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"218\" y=\"28\" class=\"svglabel\">A</text>\n      <line x1=\"35\" y1=\"115\" x2=\"385\" y2=\"115\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"370\" y=\"107\" class=\"svglabel\">B</text>\n      <line x1=\"70\" y1=\"210\" x2=\"350\" y2=\"20\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"32\" class=\"svglabel\">C</text>\n      <line x1=\"70\" y1=\"20\" x2=\"350\" y2=\"210\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"342\" y=\"205\" class=\"svglabel\">D</text>\n    </svg></div>", "steps": [{"type": "choice", "prompt": "How many of the candidate lines are symmetry lines?", "options": ["0", "1", "2", "3"], "correct": 0, "why": "No fold can match all three unequal sides and angles.", "wrong": "Test the full outline: none of the candidate folds makes matching halves."}]}];var WHAT={"heading": "A symmetry line is a perfect fold", "body": "<p>Fold along the candidate line. Every point on one half must land on a matching point on the other half.</p><div class=\"termgrid\"><div class=\"term\"><b>Non-square rectangle</b>2 lines</div><div class=\"term\"><b>Square</b>4 lines</div><div class=\"term\"><b>Isosceles triangle</b>1 line</div><div class=\"term\"><b>Scalene triangle</b>0 lines</div></div>"};var PREDICT={"heading": "Some shapes have more than \u201cmany\u201d", "visual": "<div class=\"diagram\"><svg viewBox=\"0 0 260 220\"><circle cx=\"130\" cy=\"110\" r=\"82\" fill=\"rgba(27,79,138,.08)\" stroke=\"var(--blue)\" stroke-width=\"4\"/><line x1=\"130\" y1=\"15\" x2=\"130\" y2=\"205\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/></svg></div>", "prompt": "How many lines of symmetry does a circle have?", "options": ["0", "1", "4", "Infinitely many"], "correct": 3, "why": "Every diameter divides a circle into matching halves, and there are infinitely many diameters.", "reveal": "<div class=\"goal\"><div class=\"lab\">Any direction through the center</div><p>Rotate the shown diameter to create another valid symmetry line.</p></div>"};var WHY={"heading": "Symmetry depends on the whole boundary", "body": "<p>A line may pass through the center and still fail. The two resulting outlines must match point for point.</p><p>This is why a non-square rectangle\u2019s diagonals fail: a long side would fold onto a short side.</p>"};var MISTAKE={"heading": "Noah gives every rectangle four symmetry lines", "body": "<p>He copied the square\u2019s diagonals onto a longer rectangle.</p>", "button": "Run the fold test", "reveal": "<div class=\"feedback no\"><b>A non-square rectangle has only two.</b> Its diagonal folds do not make the unequal side lengths coincide.</div>"};var QUESTIONS=[{"q": "How many symmetry lines does a non-square rectangle have?", "a": ["1", "2", "4", "0"], "correct": 1, "why": "Its vertical and horizontal center lines work."}, {"q": "How many symmetry lines does a square have?", "a": ["2", "3", "4", "Infinite"], "correct": 2, "why": "Vertical, horizontal, and both diagonals work."}, {"q": "A fold line is valid when...", "a": ["both halves match exactly", "it is vertical", "it passes through a corner", "it is the longest possible line"], "correct": 0, "why": "Exact matching after folding is the definition."}, {"q": "A scalene triangle has how many symmetry lines?", "a": ["3", "2", "1", "0"], "correct": 3, "why": "No fold pairs all three unequal sides and angles."}, {"q": "Why do a non-square rectangle\u2019s diagonals fail?", "a": ["They are too long", "They cross", "Long sides would not match short sides", "Diagonals can never be symmetry lines"], "correct": 2, "why": "The folded halves do not coincide because adjacent side lengths differ."}];
var step=0,TOTAL=11,taskIndex=0,taskStep=0,challengeDone=false,feedback='',qIndex=0,qCorrect=0,answered=false;

function renderChallenge(){
 var h='<div class="tag">Challenge</div><h2>'+CHALLENGE_TITLE+'</h2>';

 h+='<div class="challenge-list">';for(var i=0;i<TASKS.length;i++)h+='<div class="challenge-chip '+(i<taskIndex?'done':i===taskIndex&&!challengeDone?'now':'')+'">'+(i<taskIndex?'✓ ':'')+'Round '+(i+1)+'</div>';h+='</div>';

function renderQuestion(){var Q=QUESTIONS[qIndex],h='<div class="tag">Your turn</div><div class="qcount">Question '+(qIndex+1)+' of '+QUESTIONS.length+'</div><h2 style="margin-top:10px">'+Q.q+'</h2>';for(var i=0;i<Q.a.length;i++)h+='<button class="choice" id="ch'+i+'" onclick="pickQ('+i+')">'+Q.a[i]+'</button>';h+='<div id="qfb"></div><div class="nav"><button class="btn sm" onclick="reviewLesson()">← Review teaching</button><span class="qcount">Score: '+qCorrect+'</span><button class="btn" id="qnext" disabled onclick="nextQ()">Next →</button></div>';el('stage').innerHTML=h;answered=false}
function pickQ(i){if(answered)return;answered=true;var Q=QUESTIONS[qIndex];for(var j=0;j<Q.a.length;j++){var b=el('ch'+j);if(j===Q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')}var f=el('qfb');f.className='feedback '+(i===Q.correct?'ok':'no');f.innerHTML=(i===Q.correct?'✓ Correct. ':'✗ Not quite. ')+Q.why;if(i===Q.correct)qCorrect++;el('qnext').disabled=false}
function nextQ(){qIndex++;step=qIndex>=QUESTIONS.length?TOTAL-1:5+qIndex;render();scrollTo(0,0)}
function reviewLesson(){step=0;render();scrollTo(0,0)}
function markCourseDone(){try{var acct=JSON.parse(localStorage.getItem('voyage_account')||'null');var kid=(acct&&acct.activeKidId)?acct.activeKidId:'solo';var key='voyage_g4math_progress_'+kid;var p={done:{},lastSkill:0};var raw=localStorage.getItem(key);if(raw)p=JSON.parse(raw);if(!p.done)p.done={};p.done[CODE]=true;localStorage.setItem(key,JSON.stringify(p))}catch(e){}}
function renderDone(){var pct=Math.round(qCorrect/QUESTIONS.length*100),pass=pct>=80,h='<div class="done-icon">'+(pass?'✓':'↻')+'</div><h2 style="text-align:center">'+(pass?'Lesson complete':'Worth one more pass')+'</h2><p style="text-align:center" class="qcount">'+qCorrect+' of '+QUESTIONS.length+' correct</p>';if(pass){markCourseDone();h+='<div class="goal"><div class="lab">You can now</div><p>'+DONE_TEXT+'</p></div>'}else h+='<p>Review the teaching, then try the questions again.</p>';h+='<div class="nav"><button class="btn sm" onclick="restart()">↻ Again</button><button class="btn go" onclick="goCourse()">Back to Math →</button></div><div class="attrib">Task design based on IM® K–5 Math authored by Illustrative Mathematics®, licensed under CC BY 4.0.</div>';el('stage').innerHTML=h}
function goCourse(){location.href='math-course.html'}
function restart(){step=0;taskIndex=0;taskStep=0;challengeDone=false;feedback='';predictDone=false;mistakeDone=false;qIndex=0;qCorrect=0;answered=false;render();scrollTo(0,0)}
function render(){drawSteps();if(step===0)renderChallenge();else if(step===1)renderInfo(WHAT,'What just happened');else if(step===2)renderPredict();else if(step===3)renderInfo(WHY,'Why');else if(step===4)renderMistake();else if(step>=5&&step<TOTAL-1)renderQuestion();else renderDone()}
</script></body></html>
